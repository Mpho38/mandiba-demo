<style>
:root{
  --bg:#F6F1EA; --surface:#FFFFFF; --sunk:#EEE6DC; --ink:#1B1512; --muted:#6D6058; --line:#E3D8CC;
  --black:#161211; --black-ink:#FBF6F0; --orange:#E48A2F; --orange-ink:#1D1105; --orange-soft:#FBE7D1;
  --red:#A1271D; --red-soft:#F8DEDA; --good:#1E7A46; --good-soft:#DCF1E4; --warn:#9A5B00; --warn-soft:#FBEBCB;
  --info:#1D5C99; --info-soft:#DEEAF7; --red-fill:#A1271D; --good-fill:#1E7A46; --shadow:0 8px 28px rgba(22,18,17,.14); --r:14px;
  --f-display:"Archivo","Arial Black",Impact,system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#110E0C; --surface:#1B1715; --sunk:#25201D; --ink:#F4EDE7; --muted:#A99C92; --line:#352E29;
  --orange:#F09A45; --orange-ink:#1D1105; --orange-soft:#3A2614; --red:#F07366; --red-soft:#3C1B17; --red-fill:#B8392D; --good-fill:#1B6E3F; --good:#4CC27E; --good-soft:#15301F;
  --warn:#E6AF4F; --warn-soft:#352812; --info:#6FA7E6; --info-soft:#172A3E; --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110E0C; --surface:#1B1715; --sunk:#25201D; --ink:#F4EDE7; --muted:#A99C92; --line:#352E29;
  --orange:#F09A45; --orange-ink:#1D1105; --orange-soft:#3A2614; --red:#F07366; --red-soft:#3C1B17; --red-fill:#B8392D; --good-fill:#1B6E3F; --good:#4CC27E; --good-soft:#15301F;
  --warn:#E6AF4F; --warn-soft:#352812; --info:#6FA7E6; --info-soft:#172A3E; --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;min-height:100vh}
h1,h2,h3{margin:0;font-family:var(--f-display);letter-spacing:.005em;text-wrap:balance}
h1{font-size:1.7rem;font-weight:900} h2,h1.h2{font-size:1.2rem;font-weight:800} h3{font-size:1rem;font-weight:800}
p{margin:0}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.sheet-panel:focus{outline:none}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.label{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* app bar */
.bar{position:sticky;top:0;z-index:30;background:var(--black);color:var(--black-ink);padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 12px rgba(0,0,0,.25)}
.bar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand svg{flex:0 0 auto}
.brand b{font-family:var(--f-display);font-weight:900;font-size:1.25rem;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-size:.62rem;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--orange);margin-top:2px}
.bar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 10px;font-size:.76rem;font-weight:700;white-space:nowrap}
.pill.open{background:#1f3b2a;color:#8fe0ae} .pill.closed{background:#4a1b16;color:#ffb3a8}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem}
.bar .btn.ghost{color:var(--black-ink);border-color:#3a322d}
.nav{max-width:1120px;margin:0 auto;padding:0 16px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav a{flex:0 0 auto;color:#d9cfc6;text-decoration:none;font-weight:600;font-size:.9rem;padding:8px 12px;border-radius:99px}
.nav a.on{background:var(--orange);color:var(--orange-ink)}
.nav a .count{background:var(--red-fill);color:#fff;border-radius:99px;padding:0 6px;margin-left:5px;font-size:.72rem}

main.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:flex;flex-direction:column;gap:18px}

/* building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .between{justify-content:space-between} .stack{display:flex;flex-direction:column;gap:8px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.btn.dark{background:var(--black);border-color:var(--black);color:var(--black-ink)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.good{background:var(--good-fill);border-color:var(--good-fill);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 11px;font-size:.86rem;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--info);font-weight:600;cursor:pointer;text-decoration:underline}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:.8rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}
.err{color:var(--red);font-weight:600;font-size:.9rem}
.ok{color:var(--good);font-weight:600;font-size:.9rem}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:9px;padding:9px 10px;font-weight:700;cursor:pointer;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--muted);font-size:.9rem}

.t-info{background:var(--info-soft);color:var(--info)} .t-orange{background:var(--orange-soft);color:var(--warn)} .t-mute{background:var(--sunk);color:var(--muted)}
.note{background:var(--info-soft);color:var(--info);border-radius:12px;padding:10px 12px;font-size:.88rem}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.9rem;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:30px 12px}

.total{font-size:1.15rem;font-weight:800}

.avatar{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;flex:0 0 auto;overflow:hidden}

/* start screen */
.hero{position:relative;overflow:hidden;background:var(--black);color:var(--black-ink);border-radius:20px;padding:26px 22px}
.hero:before{content:"";position:absolute;right:-70px;top:-80px;width:260px;height:260px;border-radius:50%;background:var(--red);opacity:.9}
.hero:after{content:"";position:absolute;right:40px;bottom:-110px;width:200px;height:200px;border-radius:50%;background:var(--orange);opacity:.95}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.02;max-width:14ch}
.hero p{color:#d9cfc6;max-width:46ch;margin-top:10px}
.hero .facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero .facts span{background:rgba(255,255,255,.1);border-radius:99px;padding:5px 11px;font-size:.8rem;font-weight:600}
.roles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.role{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:84px}
.role:hover{border-color:var(--orange)}
.role .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:var(--orange-soft);color:var(--warn)}
.role b{display:block;font-family:var(--f-display);font-size:1.05rem}
.demo{border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.demo table{border-collapse:collapse;width:100%;font-size:.86rem}
.demo td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.06em}
.auth{max-width:440px;width:100%;margin:0 auto}

/* menu */
.menu-sec{display:flex;flex-direction:column;gap:12px;scroll-margin-top:130px}
.menu-sec h2{font-size:1.35rem;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
.items{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.item{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;min-width:0}
.item .ph{aspect-ratio:16/10;width:100%;background:var(--sunk) center/cover no-repeat;position:relative}
.item .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.item .nm{font-weight:800;line-height:1.2}
.item .ds{font-size:.84rem;color:var(--muted);line-height:1.35}
.item .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:4px}
.item .pr{font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.item .add{width:36px;height:36px;border-radius:50%;background:var(--orange);color:var(--orange-ink);display:grid;place-items:center;font-weight:900;font-size:1.25rem}
.item[aria-disabled="true"]{cursor:not-allowed} .item[aria-disabled="true"] .ph{filter:grayscale(1);opacity:.55}
.soldout{position:absolute;left:10px;top:10px;background:var(--red-fill);color:#fff;font-weight:800;font-size:.75rem;padding:4px 9px;border-radius:99px;letter-spacing:.04em}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;cursor:pointer;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-soft)}
.opt .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-size:.75rem;flex:0 0 auto}
.opt[aria-pressed="true"] .box{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:var(--sunk);width:40px;height:40px;font-weight:900;font-size:1.1rem;cursor:pointer}
.stepper span{min-width:36px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.cartbar .btn{max-width:560px;margin:0 auto;display:flex;width:100%;justify-content:space-between;min-height:54px;box-shadow:var(--shadow)}
.line{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}

/* tracker */
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding-bottom:16px;position:relative}
.steps li:before{content:"";position:absolute;left:14px;top:28px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child:before{display:none}
.steps li.done:before{background:var(--orange)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.8rem;font-weight:900;z-index:1}
.steps li.done .dot{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.steps li.now .dot{background:var(--black);border-color:var(--orange);color:var(--orange);box-shadow:0 0 0 5px var(--orange-soft)}
.steps .st{font-weight:700;padding-top:4px} .steps li:not(.done):not(.now) .st{color:var(--muted);font-weight:500}
.steps .tm{font-size:.8rem;color:var(--muted);padding-top:6px;font-variant-numeric:tabular-nums}
.map{width:100%;height:280px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--sunk)}

/* staff board */
.board{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:120px}

.col-h .n{background:var(--surface);border-radius:99px;padding:1px 10px;font-family:var(--f-body);font-size:.85rem}
.oc{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--info);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.oc.col-t{border-left-color:var(--warn)}
.oc.fresh{animation:flash 1.2s ease-in-out 3}
@keyframes flash{50%{box-shadow:0 0 0 4px var(--orange)}}
.oc ul{margin:0;padding-left:18px;font-size:.9rem}
.oc ul .x{color:var(--muted);font-size:.8rem}
.cash{background:var(--red-fill);color:#fff;font-weight:800;border-radius:8px;padding:4px 9px;font-size:.82rem;align-self:flex-start}
.tillgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.tillbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:76px}
.tillbtn b{font-variant-numeric:tabular-nums}

/* tables, stats, charts */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:.88rem}
.tbl th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl input,.tbl select{min-height:38px;padding:6px 8px}
.tbl tr.unmatched td{background:var(--warn-soft)}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;font-family:var(--f-display)}
.stat.hero2{background:var(--black);color:var(--black-ink);border-color:var(--black)} .stat.hero2 .label{color:var(--orange)}
.bars{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:.88rem}
.track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:var(--orange);border-radius:99px}
.chart text{font-size:10px;fill:var(--muted)}
.thumb{width:52px;height:52px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}

/* overlays */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(10,7,6,.6)}
.sheet-panel{position:relative;background:var(--surface);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:720px){.sheet{align-items:center}.sheet-panel{border-radius:20px}}
.sheet .ph{aspect-ratio:16/9;border-radius:14px;background:var(--sunk) center/cover no-repeat}
.sheet-body{display:flex;flex-direction:column;gap:14px}

.sheet-x{position:sticky;top:0;z-index:3;align-self:flex-end;margin:-6px -4px -46px 0;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(22,18,17,.72);color:#fff;font-size:1rem;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(0,0,0,.25)}

.full .map{flex:1;height:auto;min-height:0}
.toasts{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{background:var(--black);color:var(--black-ink);padding:11px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:480px}
.alertbar{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:90;width:min(560px,calc(100% - 24px));background:var(--red-fill);color:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;transition:transform .35s ease}

.avpick button[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-soft)}
.smsdemo{background:var(--info-soft);border:1px dashed var(--info);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}

.rec.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(161,39,29,.6)}100%{box-shadow:0 0 0 16px rgba(161,39,29,0)}}
.legal{max-width:760px;width:100%;margin:0 auto;gap:14px;line-height:1.6}
.legal section{display:flex;flex-direction:column;gap:6px}
.legal h2{margin-top:6px}
.legal ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.legal p{max-width:70ch}
footer.foot{max-width:1120px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.8rem;display:flex;gap:6px 16px;flex-wrap:wrap}

@media (max-width:820px){.board{grid-template-columns:1fr}.col.hide-sm{display:none}}
@media (min-width:821px){#colpick{display:none}}

  .bar-in{flex-wrap:nowrap;padding:8px 12px;gap:8px}

  .bar .btn.sm{min-height:34px;padding:5px 9px;font-size:.8rem}

  h1{font-size:1.4rem}

  .item{flex-direction:row;align-items:stretch}
  .item .ph{aspect-ratio:auto;width:112px;min-height:112px;flex:0 0 112px}

}

/* ---- lib/money.js ---- */
/* lib/money.js: all money is integer cents (docs/DATA.md Conventions). Pure; runs in Node for tests. */

function formatRand(cents) {
  const n = Math.round(Number(cents) || 0);
  const abs = Math.abs(n);
  const rands = String(Math.floor(abs / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (n < 0 ? "-R" : "R") + rands + "." + String(abs % 100).padStart(2, "0");
}

function sumCents(list) {
  return list.reduce((a, v) => a + Math.round(Number(v) || 0), 0);
}

/* "19.5", "R19,50", " 19 " -> 1950; anything else -> null */
function parseRandInput(text) {
  const s = String(text ?? "").trim().replace(/^r\s*/i, "").replace(/\s+/g, "").replace(",", ".");
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return null;
  return Math.round(parseFloat(s) * 100);
}

if (typeof module !== "undefined" && module.exports) module.exports = { formatRand, sumCents, parseRandInput };

/* ---- lib/crypto.js ---- */
/* lib/crypto.js: security primitives (docs/SECURITY.md sections 1-2). Uses WebCrypto (browser and Node 20+). */

const SECRET_ITERATIONS = 310000;

function bytesToB64(bytes) {
  let s = "";
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s);
}

function b64ToBytes(b64) {
  const s = atob(b64), out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}

function randomId(prefix) {
  const bytes = crypto.getRandomValues(new Uint8Array(10));
  return (prefix ? prefix + "_" : "") + Array.from(bytes, b => (b % 36).toString(36)).join("");
}

function randomSaltB64() {
  return bytesToB64(crypto.getRandomValues(new Uint8Array(16)));
}

async function hashSecret(secret, saltB64, iterations = SECRET_ITERATIONS) {
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(String(secret)), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64ToBytes(saltB64), iterations }, key, 256);
  return bytesToB64(new Uint8Array(bits));
}

function constantTimeEqual(a, b) {
  if (a.length !== b.length) return false;
  let diff = 0;
  for (let i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return diff === 0;
}

async function verifySecret(secret, user) {
  if (!user || !user.secretHash || !user.secretSalt) return false;
  const h = await hashSecret(secret, user.secretSalt, user.secretIter || SECRET_ITERATIONS);
  return constantTimeEqual(h, user.secretHash);
}

function base32ToBytes(b32) {
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  const clean = String(b32).toUpperCase().replace(/[^A-Z2-7]/g, "");
  let bits = 0, value = 0;
  const out = [];
  for (const ch of clean) {
    value = ((value << 5) | alphabet.indexOf(ch)) & 0xffff;
    bits += 5;
    if (bits >= 8) { out.push((value >>> (bits - 8)) & 255); bits -= 8; }
  }
  return new Uint8Array(out);
}

async function totp(base32Secret, timeMs, step = 30, digits = 6) {
  let counter = Math.floor(timeMs / 1000 / step);
  const msg = new Uint8Array(8);
  for (let i = 7; i >= 0; i--) { msg[i] = counter % 256; counter = Math.floor(counter / 256); }
  const key = await crypto.subtle.importKey("raw", base32ToBytes(base32Secret), { name: "HMAC", hash: "SHA-1" }, false, ["sign"]);
  const mac = new Uint8Array(await crypto.subtle.sign("HMAC", key, msg));
  const off = mac[mac.length - 1] & 15;
  const bin = ((mac[off] & 127) << 24) | (mac[off + 1] << 16) | (mac[off + 2] << 8) | mac[off + 3];
  return String(bin % 10 ** digits).padStart(digits, "0");
}

async function verifyTotp(code, base32Secret, nowMs) {
  const c = String(code || "").replace(/\s/g, "");
  if (!/^\d{6}$/.test(c)) return false;
  let ok = false;
  for (const drift of [-1, 0, 1]) {
    if (constantTimeEqual(await totp(base32Secret, nowMs + drift * 30000), c)) ok = true;
  }
  return ok;
}

if (typeof module !== "undefined" && module.exports) module.exports = { SECRET_ITERATIONS, randomId, randomSaltB64, hashSecret, verifySecret, totp, verifyTotp, base32ToBytes };

/* ---- lib/geo.js ---- */
/* lib/geo.js: location helpers (docs/ARCHITECTURE.md Live updates and alerts). Pure; runs in Node for tests. */

function distanceM(a, b) {
  const R = 6371000, rad = d => d * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

/* Move `metres` from `from` towards `to` (stops on `to`). */
function stepToward(from, to, metres) {
  const d = distanceM(from, to);
  if (d <= metres || d === 0) return { lat: to.lat, lng: to.lng };
  const k = metres / d;
  return { lat: from.lat + (to.lat - from.lat) * k, lng: from.lng + (to.lng - from.lng) * k };
}

/* Reads coordinates from a pasted Google Maps link (or "lat, lng"). Never fetches the URL. */
function parseMapsLink(url) {
  let s = String(url || "");
  try { s = decodeURIComponent(s); } catch (e) { /* keep raw */ }
  const pats = [/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/, /[?&](?:q|query|ll|destination)=(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/,
    /!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/, /^\s*(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)\s*$/];
  for (const p of pats) {
    const m = s.match(p);
    if (m) {
      const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
      if (Math.abs(lat) <= 90 && Math.abs(lng) <= 180) return { lat, lng };
    }
  }
  return null;
}

function mapsDirectionsUrl(p) {
  return `https://www.google.com/maps/dir/?api=1&destination=${p.lat.toFixed(6)},${p.lng.toFixed(6)}`;
}

if (typeof module !== "undefined" && module.exports) module.exports = { distanceM, stepToward, parseMapsLink, mapsDirectionsUrl };

/* ---- store.js ---- */
/* store.js: the ONLY data layer (docs/ARCHITECTURE.md Store). Collections and fields: docs/DATA.md.
   LocalStore = one localStorage key per collection + BroadcastChannel for live cross-tab sync.
   Writes that must be all-or-nothing go through transaction(), which holds a cross-tab lock. */

function createLocalStore(prefix = "mandiba.v1.") {
  const cache = {}, subs = {};
  let memoryOnly = false, probed = null;
  const channel = typeof BroadcastChannel !== "undefined" ? new BroadcastChannel("mandiba") : null;
  const tabId = Math.random().toString(36).slice(2);
  const PROBE = "mandiba.probe"; // outside `prefix`, so other tabs' storage listeners ignore it

  /* Checked once per tab: writing the probe fires "storage" events in other tabs, so it must never repeat. */
  function storage() {
    if (probed !== null) return probed;
    try { const ls = window.localStorage; ls.setItem(PROBE, "1"); ls.removeItem(PROBE); probed = ls; }
    catch (e) { memoryOnly = true; probed = null; }
    return probed;
  }

  function load(coll, fresh) {
    if (!fresh && cache[coll]) return cache[coll];
    const ls = storage();
    let data = cache[coll] || {};
    if (ls) { try { const raw = ls.getItem(prefix + coll); data = raw ? JSON.parse(raw) : {}; } catch (e) { data = {}; } }
    cache[coll] = data;
    return data;
  }

  function persist(colls) {
    const ls = storage();
    if (!ls) return;
    for (const c of colls) {
      try { ls.setItem(prefix + c, JSON.stringify(cache[c] || {})); }
      catch (e) {
        const quota = e && (e.name === "QuotaExceededError" || e.code === 22);
        const err = new Error(quota ? "Storage is full: remove old slip photos or recordings, or reset the demo." : "Couldn't save: " + e.message);
        err.code = quota ? "quota" : "storage";
        throw err;
      }
    }
  }

  function notify(colls, remote) {
    for (const c of colls) for (const cb of subs[c] || []) { try { cb(c, remote); } catch (e) { console.error(e); } }
  }

  function broadcast(colls) {
    if (channel) channel.postMessage({ colls, from: tabId });
  }

  /* Other tabs' writes arrive by BroadcastChannel; the "storage" event is only a fallback when that isn't available. */
  if (channel) channel.onmessage = ev => {
    const colls = ((ev.data && ev.data.colls) || []).filter(c => ALL_COLLECTIONS.includes(c));
    for (const c of colls) load(c, true);
    if (colls.length) notify(colls, true);
  };
  else if (typeof window !== "undefined") window.addEventListener("storage", ev => {
    if (!ev.key || !ev.key.startsWith(prefix)) return;
    const c = ev.key.slice(prefix.length);
    if (!ALL_COLLECTIONS.includes(c)) return;
    load(c, true);
    notify([c], true);
  });

  const clone = v => (v == null ? v : JSON.parse(JSON.stringify(v)));

  const api = {
    get memoryOnly() { storage(); return memoryOnly; },
    tabId,
    get(coll, id) { return clone(load(coll)[id] || null); },
    list(coll, fn) { const all = Object.values(load(coll)).map(clone); return fn ? all.filter(fn) : all; },
    count(coll) { return Object.keys(load(coll)).length; },
    subscribe(coll, cb) { (subs[coll] = subs[coll] || []).push(cb); return () => { subs[coll] = subs[coll].filter(x => x !== cb); }; },
    /* Single-doc write; use transaction() when several docs must change together. */
    async put(coll, doc) { return api.transaction(tx => { tx.put(coll, doc); }); },
    async remove(coll, id) { return api.transaction(tx => { tx.remove(coll, id); }); },
    /* fn(tx) runs on fresh data under a lock; tx.get/list/put/remove; throwing aborts everything. */
    async transaction(fn) {
      const run = async () => {
        const touched = new Set(), staged = {};
        const view = coll => { if (!staged[coll]) staged[coll] = { ...load(coll, true) }; return staged[coll]; };
        const tx = {
          get: (coll, id) => clone(view(coll)[id] || null),
          list: (coll, f) => { const all = Object.values(view(coll)).map(clone); return f ? all.filter(f) : all; },
          put: (coll, doc) => { if (!doc || !doc.id) throw new Error("put needs a doc with an id"); view(coll)[doc.id] = { ...clone(doc), _v: ((view(coll)[doc.id] || {})._v || 0) + 1 }; touched.add(coll); },
          remove: (coll, id) => { delete view(coll)[id]; touched.add(coll); },
          clear: coll => { staged[coll] = {}; touched.add(coll); },
        };
        const result = await fn(tx);
        const colls = [...touched];
        const backup = {};
        for (const c of colls) { backup[c] = cache[c]; cache[c] = staged[c]; }
        try { persist(colls); }
        catch (e) { for (const c of colls) cache[c] = backup[c]; persist(colls.filter(c => backup[c])); throw e; }
        broadcast(colls);
        notify(colls, false);
        return result;
      };
      if (typeof navigator !== "undefined" && navigator.locks && !memoryOnly) return navigator.locks.request("mandiba-store", run);
      return run();
    },
  };
  return api;
}

/* ---- domain.js ---- */
/* domain.js: pure business rules, no DOM and no storage (docs/ARCHITECTURE.md Domain rules).
   Names and shapes follow docs/DATA.md. Every rule is covered by tests/domain.test.js. */

const STATUS_FLOW = {
  delivery: ["received", "preparing", "ready", "with_driver", "on_the_way", "delivered"],
  collection: ["received", "preparing", "ready", "collected"],
};
const TERMINAL = ["delivered", "collected", "cancelled"];
const STATUS_LABEL = {
  received: "Received", preparing: "Preparing", ready: "Ready", with_driver: "With driver",
  on_the_way: "On its way", delivered: "Delivered", collected: "Collected", cancelled: "Cancelled",
};
const SAST_OFFSET_MS = 2 * 3600e3;

function byId(list) { const m = {}; for (const x of list || []) m[x.id] = x; return m; }

/* ---------------- phone ---------------- */
function normalizePhone(input) {
  const raw = String(input || "").trim();
  let d = raw.replace(/[^\d]/g, "");
  if (raw.startsWith("+")) d = "+" + d;
  else if (d.startsWith("27") && d.length === 11) d = "+" + d;
  else if (d.startsWith("0") && d.length === 10) d = "+27" + d.slice(1);
  else return null;
  return /^\+27[1-9]\d{8}$/.test(d) ? d : (/^\+\d{10,15}$/.test(d) && !d.startsWith("+27") ? d : null);
}

function formatPhone(e164) {
  const m = String(e164 || "").match(/^\+27(\d{2})(\d{3})(\d{4})$/);
  return m ? `0${m[1]} ${m[2]} ${m[3]}` : String(e164 || "");
}

/* ---------------- availability & pricing ---------------- */
function recipeOk(recipe, stockById) {
  for (const line of recipe || []) {
    const s = stockById[line.stockItemId];
    if (!s || !s.active) return false;
    if (s.tracked && s.qty + 1e-9 < line.qty) return false;
  }
  return true;
}

/* ctx = {stockById, sectionsById} */
function isAvailable(item, ctx) {
  if (!item || !item.active || item.hidden || item.soldOutManual) return false;
  const sec = ctx.sectionsById[item.sectionId];
  if (!sec || sec.hidden) return false;
  return recipeOk(item.recipe, ctx.stockById);
}

function isOptionAvailable(option, stockById) { return recipeOk(option.recipe, stockById); }

/* chosen = [{groupId, optionId}] -> error text or null */
function validateOptions(item, chosen, groupsById) {
  const sel = chosen || [];
  for (const c of sel) {
    if (!(item.optionGroupIds || []).includes(c.groupId)) return "That option doesn't belong to this item.";
    const g = groupsById[c.groupId];
    if (!g || !g.options.some(o => o.id === c.optionId)) return "That option no longer exists.";
  }
  for (const gid of item.optionGroupIds || []) {
    const g = groupsById[gid];
    if (!g) continue;
    const n = sel.filter(c => c.groupId === gid).length;
    if (n < g.min) return g.min === 1 ? `Choose at least one: ${g.name.toLowerCase()}.` : `Choose at least ${g.min}: ${g.name.toLowerCase()}.`;
    if (n > g.max) return `Choose at most ${g.max}: ${g.name.toLowerCase()}.`;
  }
  return null;
}

function resolveOptions(chosen, groupsById) {
  return (chosen || []).map(c => {
    const o = groupsById[c.groupId].options.find(x => x.id === c.optionId);
    return { groupId: c.groupId, optionId: c.optionId, name: o.name, price: o.price };
  });
}

function priceLine(item, chosen, groupsById) {
  return item.price + resolveOptions(chosen, groupsById).reduce((a, o) => a + o.price, 0);
}

/* lines: [{qty, unitPrice}] (lineTotal is recomputed) */
function orderTotals(lines, fulfilment, settings, tip) {
  const subtotal = lines.reduce((a, l) => a + l.unitPrice * l.qty, 0);
  const deliveryFee = fulfilment === "delivery" ? settings.deliveryFee : 0;
  const t = fulfilment === "delivery" ? Math.max(0, Math.round(tip || 0)) : 0;
  return { subtotal, deliveryFee, tip: t, total: subtotal + deliveryFee + t };
}

/* ---------------- order state machine ---------------- */
function nextStatuses(order, role, userId) {
  if (!order || TERMINAL.includes(order.status)) return [];
  const flow = STATUS_FLOW[order.fulfilment];
  const i = flow.indexOf(order.status);
  const next = flow[i + 1];
  const out = [];
  if (role === "employee" || role === "admin") {
    if (["received", "preparing"].includes(order.status)) out.push(next);
    if (order.status === "ready") out.push(order.fulfilment === "delivery" ? "with_driver" : "collected");
  }
  if (role === "driver" && order.driverId === userId && ["with_driver", "on_the_way"].includes(order.status)) out.push(next);
  if (role === "admin" && ["received", "preparing", "ready"].includes(order.status)) out.push("cancelled");
  return out;
}

function canTransition(order, next, role, userId) {
  return nextStatuses(order, role, userId).includes(next);
}

/* ---------------- stock ---------------- */
function stockNeeded(lines, menuById, groupsById) {
  const need = {};
  const add = (recipe, qty) => { for (const r of recipe || []) need[r.stockItemId] = (need[r.stockItemId] || 0) + r.qty * qty; };
  for (const l of lines) {
    const item = menuById[l.menuItemId];
    if (item) add(item.recipe, l.qty);
    for (const o of l.options || []) {
      const g = groupsById[o.groupId];
      const opt = g && g.options.find(x => x.id === o.optionId);
      if (opt) add(opt.recipe, l.qty);
    }
  }
  for (const k in need) need[k] = Math.round(need[k] * 1000) / 1000;
  return need;
}

/* Returns {ok, error, items: [updated stock docs], movements: [...]}; refuses if a tracked item would go below 0. */
function applyStock(stockById, delta, meta) {
  const items = [], movements = [];
  for (const [id, change] of Object.entries(delta)) {
    const s = stockById[id];
    if (!s) return { ok: false, error: `Unknown stock item ${id}` };
    if (!s.tracked || change === 0) continue;
    const after = Math.round((s.qty + change) * 1000) / 1000;
    if (after < -1e-9) return { ok: false, error: `Not enough ${s.name}`, stockItemId: id };
    items.push({ ...s, qty: after });
    movements.push({ stockItemId: id, delta: change, qtyAfter: after, reason: meta.reason, refId: meta.refId || null, note: meta.note || "", by: meta.by || null, at: meta.at });
  }
  return { ok: true, items, movements };
}

function negate(need) { const o = {}; for (const k in need) o[k] = -need[k]; return o; }
function deductForOrder(stockById, need, meta) { return applyStock(stockById, negate(need), { ...meta, reason: "order" }); }
function restoreStock(stockById, need, meta) { return applyStock(stockById, need, { ...meta, reason: "order-cancel" }); }

/* ---------------- time ---------------- */
function sastParts(ms) {
  const d = new Date(ms + SAST_OFFSET_MS);
  return { y: d.getUTCFullYear(), mo: d.getUTCMonth(), d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), dow: d.getUTCDay() };
}
function sastDayStart(ms) { return ms - ((ms + SAST_OFFSET_MS) % 86400000); }

function isOpen(nowMs, settings) {
  const p = sastParts(nowMs), mins = p.h * 60 + p.mi;
  const toMin = t => { const [h, m] = String(t).split(":").map(Number); return h * 60 + m; };
  const o = toMin(settings.openTime), c = toMin(settings.closeTime);
  return o <= c ? mins >= o && mins < c : mins >= o || mins < c;
}

/* ---------------- accounting ---------------- */
function orderDoneAt(o) { return (o.timeline && (o.timeline.delivered || o.timeline.collected)) || null; }

function accounting(orders, tillSales, purchases, from, to) {
  const inRange = t => t != null && t >= from && t < to;
  let orderIncome = 0, tips = 0, cashDue = 0;
  const byMethod = { card: 0, eft: 0, cash: 0 }, qty = {};
  for (const o of orders) {
    const done = orderDoneAt(o);
    if (!inRange(done) || o.status === "cancelled") continue;
    if (["paid", "cash_received"].includes(o.payment.status)) {
      orderIncome += o.subtotal + o.deliveryFee;
      tips += o.tip;
      byMethod[o.payment.method] = (byMethod[o.payment.method] || 0) + o.subtotal + o.deliveryFee;
      for (const l of o.lines) qty[l.menuItemId] = { name: l.name, qty: ((qty[l.menuItemId] || {}).qty || 0) + l.qty };
    } else if (o.payment.status === "cash_due") {
      cashDue += o.total;
    }
  }
  let tillIncome = 0;
  for (const s of tillSales) if (inRange(s.at)) { tillIncome += s.total; byMethod[s.method] = (byMethod[s.method] || 0) + s.total; }
  let spend = 0;
  for (const p of purchases) if (inRange(p.at)) spend += p.total;
  const income = orderIncome + tillIncome;
  const bestSellers = Object.entries(qty).map(([menuItemId, v]) => ({ menuItemId, name: v.name, qty: v.qty })).sort((a, b) => b.qty - a.qty);
  return { orderIncome, tillIncome, income, tips, spend, profit: income - spend, cashDue, byMethod, bestSellers };
}

function csvCell(v) { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
function randCell(c) { return c ? (c / 100).toFixed(2) : ""; }
function isoSast(ms) { const p = sastParts(ms); return `${p.y}-${String(p.mo + 1).padStart(2, "0")}-${String(p.d).padStart(2, "0")} ${String(p.h).padStart(2, "0")}:${String(p.mi).padStart(2, "0")}`; }

function toCsv(orders, tillSales, purchases, from, to) {
  const rows = [];
  for (const o of orders) {
    const done = orderDoneAt(o);
    if (done == null || done < from || done >= to || !["paid", "cash_received"].includes(o.payment.status)) continue;
    rows.push([done, "order", o.number, o.lines.map(l => `${l.qty}x ${l.name}`).join("; "), o.payment.method, randCell(o.subtotal + o.deliveryFee), randCell(o.tip), ""]);
  }
  for (const s of tillSales) if (s.at >= from && s.at < to)
    rows.push([s.at, "till", s.id, s.lines.map(l => `${l.qty}x ${l.name}`).join("; "), s.method, randCell(s.total), "", ""]);
  for (const p of purchases) if (p.at >= from && p.at < to)
    rows.push([p.at, "purchase", p.id, `${p.supplier || "Purchase"} (${p.lines.length} lines)`, "", "", "", randCell(p.total)]);
  rows.sort((a, b) => a[0] - b[0]);
  const head = "date,type,ref,description,method,income,tip,spend";
  return [head, ...rows.map(r => [isoSast(r[0]), ...r.slice(1)].map(csvCell).join(","))].join("\n") + "\n";
}

/* ---------------- delivery alerts ---------------- */
function alertFor(distance, settings, order) {
  const a = order.alerts || {};
  if (distance <= settings.arrivedMeters && !a.arrived) return "arrived";
  if (distance <= settings.nearMeters && !a.near && !a.arrived) return "near";
  return null;
}

/* ---------------- notifications ---------------- */
function newOrderNotification(order, users, settings, now) {
  const to = [{ userId: null, role: "shop", phone: settings.notify.shopPhone }];
  for (const u of users) if (u.role === "employee" && u.active && u.phone) to.push({ userId: u.id, role: "employee", phone: u.phone });
  return { type: "new_order", orderId: order.id, to, channels: ["in_app", "sms"], simulated: true, at: now, ackBy: null, ackAt: null };
}

function reminderDue(order, notifications, settings, now) {
  if (order.status !== "received") return false;
  const mine = notifications.filter(n => n.orderId === order.id && (n.type === "new_order" || n.type === "order_reminder"));
  if (!mine.length) return false;
  const last = Math.max(...mine.map(n => n.at));
  return now - last >= settings.notify.remindEveryMin * 60000;
}

/* ---------------- spoken purchases ---------------- */
const NUM_WORDS = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12,
  thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19, twenty: 20, thirty: 30, forty: 40,
  fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90, hundred: 100, half: 0.5, dozen: 12 };
const UNIT_WORDS = { kg: ["g", 1000], kgs: ["g", 1000], kilo: ["g", 1000], kilos: ["g", 1000], kilogram: ["g", 1000], kilograms: ["g", 1000],
  g: ["g", 1], grams: ["g", 1], gram: ["g", 1], l: ["ml", 1000], litre: ["ml", 1000], litres: ["ml", 1000], liter: ["ml", 1000], liters: ["ml", 1000],
  ml: ["ml", 1] };
const FILLER = new Set(["of", "the", "some", "x", "pack", "packs", "packet", "packets", "box", "boxes", "can", "cans", "bottle", "bottles",
  "loaf", "loaves", "piece", "pieces", "pcs", "slice", "slices", "tray", "trays", "bag", "bags", "each", "total", "please", "i", "bought", "we", "got", "plus"]);
const ALIASES = [
  [/red ?bull/, "prd-redbull"], [/coke.*2 ?l|2 ?l.*coke/, "prd-coke-2l"], [/\bcoke|coca/, "prd-coke-can"], [/cappy/, "prd-cappy-can"],
  [/refresh/, "prd-refresh"], [/dragon/, "prd-dragon"], [/switch/, "prd-switch"], [/mofaya/, "prd-mofaya"], [/schweppes/, "prd-schweppes"],
  [/powerade/, "prd-powerade"], [/kota bread|quarter bread/, "ing-kota-bread"], [/bread|loaves|loaf/, "prd-bread-white"], [/egg/, "ing-egg"],
  [/chip|potato/, "ing-chips"], [/russian/, "ing-russian"], [/vienna/, "ing-vienna"], [/polony/, "ing-polony"], [/cheese/, "ing-cheese"],
  [/wing/, "ing-wing"], [/steak/, "ing-steak"], [/wors|boerewors/, "ing-wors"], [/fish/, "ing-fish"], [/pap|maize|mielie/, "ing-pap"],
  [/beef patt/, "ing-beef-patty"], [/chicken patt/, "ing-chicken-patty"], [/bun/, "ing-burger-bun"], [/chicken/, "ing-chicken-quarter"],
  [/atchar|achar/, "ing-atchar"], [/lettuce/, "ing-lettuce"], [/chakalaka/, "ing-chakalaka"], [/coleslaw/, "ing-coleslaw"],
  [/beetroot/, "ing-beetroot"], [/salsa/, "ing-salsa"], [/airtime/, "prd-airtime"],
];

function wordsToNumber(tokens) {
  let total = 0, cur = 0, used = 0;
  for (const t of tokens) {
    if (/^\d+([.,]\d+)?$/.test(t)) { if (used) break; cur = parseFloat(t.replace(",", ".")); used++; continue; }
    if (!(t in NUM_WORDS)) break;
    const v = NUM_WORDS[t];
    if (v === 100) cur = (cur || 1) * 100;
    else if (t === "dozen") cur = (cur || 1) * 12;
    else cur += v;
    used++;
  }
  total += cur;
  return used ? { value: total, used } : null;
}

function matchStock(words, stockItems) {
  const text = words.join(" ");
  const ids = new Set(stockItems.filter(s => s.active !== false).map(s => s.id));
  for (const [re, id] of ALIASES) if (re.test(text) && ids.has(id)) return id;
  let best = null, bestScore = 0;
  for (const s of stockItems) {
    const name = s.name.toLowerCase().replace(/[()]/g, " ");
    const score = words.filter(w => w.length > 2 && name.includes(w.replace(/s$/, ""))).length;
    if (score > bestScore) { best = s.id; bestScore = score; }
  }
  return bestScore ? best : null;
}

function parseSpokenPurchase(text, stockItems) {
  const stockById = byId(stockItems);
  const phrases = String(text || "").toLowerCase().replace(/r\s?(\d)/g, "r$1")
    .split(/,|;|\n|\band\b|\bplus\b/).map(p => p.trim()).filter(Boolean);
  const lines = [], unmatched = [];
  for (const phrase of phrases) {
    let price = null, priceIsTotal = false;
    let rest = phrase.replace(/\b(?:at|for|@)\s*r?\s*(\d+(?:[.,]\d{1,2})?)\s*(each|total|altogether|for all)?/, (m, p, kind) => {
      price = Math.round(parseFloat(p.replace(",", ".")) * 100);
      priceIsTotal = kind === "total" || kind === "altogether" || kind === "for all";
      return " ";
    });
    const toks = rest.replace(/[^a-z0-9.,\s]/g, " ").split(/\s+/).filter(Boolean);
    const num = wordsToNumber(toks);
    let qty = num ? num.value : null, i = num ? num.used : 0;
    let unitMul = 1, unitKind = null;
    if (toks[i] && UNIT_WORDS[toks[i]]) { [unitKind, unitMul] = UNIT_WORDS[toks[i]]; i++; }
    const itemWords = toks.slice(i).filter(w => !FILLER.has(w) && !/^\d/.test(w));
    const id = itemWords.length ? matchStock(itemWords, stockItems) : null;
    if (!id || qty == null || qty <= 0) { unmatched.push(phrase); continue; }
    const s = stockById[id];
    if (unitKind && s.unit === unitKind) qty = qty * unitMul;
    qty = Math.round(qty * 1000) / 1000;
    let unitCost = null;
    if (price != null) unitCost = priceIsTotal ? Math.round(price / qty) : price;

const SEED_VERSION = 1;
const ALL_COLLECTIONS = ["users", "menuSections", "menuItems", "optionGroups", "stockItems", "stockMovements", "purchases", "orders",
  "locations", "tillSales", "platterRequests", "notifications", "settings", "counters", "meta"];

function defaultSettings(demo) {

async function makeUser(base, secret) {

  return { failedAttempts: 0, lockedUntil: null, mustChangeSecret: false, active: true, createdAt: Date.now(), lastLoginAt: null,
    returning: true, totpSecret: null, avatar: 1, ...base, secretSalt: salt, secretIter: SECRET_ITERATIONS, secretHash: await hashSecret(secret, salt) };
}

function isSeeded(store) { return !!store.get("meta", "seed"); }

async function seedDemo(store) {
  const { menu, stock, demo } = SEED;
  const now = Date.now();
  const staff = demo.staff.map(s => makeUser({ id: s.id, role: s.role, username: s.username, displayName: s.displayName, phone: s.phone,
    totpSecret: s.totpSecret || null, avatar: s.role === "driver" ? 9 : 5 }, s.demoSecret));
  const custs = demo.customers.map(c => makeUser({ id: c.id, role: "customer", username: c.username, displayName: c.displayName,
    phone: c.phone, avatar: c.avatar }, c.demoPin));
  const users = await Promise.all([...staff, ...custs]);
  const settings = defaultSettings(demo);

  await store.transaction(tx => {
    for (const c of ALL_COLLECTIONS) tx.clear(c);
    for (const u of users) tx.put("users", u);
    for (const s of menu.sections) tx.put("menuSections", s);
    for (const i of menu.items) tx.put("menuItems", i);
    for (const g of menu.optionGroups) tx.put("optionGroups", g);
    for (const s of stock.stockItems) tx.put("stockItems", s);
    tx.put("settings", settings);

    const menuById = byId(menu.items), groupsById = byId(menu.optionGroups);
    let stockById = byId(stock.stockItems), next = 1;
    const usersById = byId(users);
    for (const so of demo.orders) {
      const created = now - so.minutesAgo * 60000;
      const lines = so.lines.map(l => {
        const item = menuById[l.menuItemId], chosen = l.options || [];
        const unitPrice = priceLine(item, chosen, groupsById);
        return { menuItemId: item.id, name: item.name, qty: l.qty, unitPrice, options: resolveOptions(chosen, groupsById), lineTotal: unitPrice * l.qty };
      });
      const totals = orderTotals(lines, so.fulfilment, settings, so.tip || 0);
      const flow = STATUS_FLOW[so.fulfilment], idx = flow.indexOf(so.status), timeline = {};
      flow.slice(0, idx + 1).forEach((s, k) => { timeline[s] = created + k * 4 * 60000; });
      const done = ["delivered", "collected"].includes(so.status);
      const cust = usersById[so.customerId];
      const order = {
        id: randomId("ord"), number: "MND-" + String(next++).padStart(4, "0"), customerId: cust.id, customerName: cust.displayName,
        customerPhone: cust.phone, customerAvatar: cust.avatar, lines, fulfilment: so.fulfilment,
        address: so.fulfilment === "delivery" ? { text: so.address.text, res: so.address.res, room: so.address.room,
          lat: DEFAULT_RES_POINT.lat, lng: DEFAULT_RES_POINT.lng, source: "demo" } : null,
        ...totals, payment: { method: so.payment, status: so.payment === "cash" ? (done ? "cash_received" : "cash_due") : "paid", ref: so.payment === "cash" ? null : "DEMO-" + next, at: created },
        status: so.status, timeline, driverId: idx >= flow.indexOf("with_driver") && so.fulfilment === "delivery" ? "usr_driver1" : null,
        alerts: done ? { near: { at: timeline.delivered - 60000, channel: "in_app" }, arrived: { at: timeline.delivered, channel: "in_app" } } : {},
        stockApplied: true, cancelReason: null, createdAt: created, sample: true,
      };
      const r = deductForOrder(stockById, stockNeeded(lines, menuById, groupsById), { refId: order.id, by: "seed", at: created });
      if (!r.ok) throw new Error("Seed stock error: " + r.error);
      for (const s of r.items) { tx.put("stockItems", s); stockById[s.id] = s; }
      for (const m of r.movements) tx.put("stockMovements", { id: randomId("mov"), ...m });
      tx.put("orders", order);
      if (order.status === "received") tx.put("notifications", { id: randomId("ntf"), ...newOrderNotification(order, users, settings, created) });
    }
    tx.put("counters", { id: "orders", next });
    tx.put("meta", { id: "seed", version: SEED_VERSION, at: now });
  });
}

/* ---- auth.js ---- */
/* auth.js: sign-up, sign-in, lockout, sessions, the admin second check and role guards (docs/SECURITY.md).
   Only generic error messages; secrets are PBKDF2-hashed; the session holds no secret. */

const SESSION_KEY = "mandiba.session";
const IDLE_LIMIT = { customer: 12 * 3600e3, employee: 8 * 3600e3, driver: 8 * 3600e3, admin: 8 * 3600e3 };
const GENERIC = {
  customer: "Username, phone or PIN is incorrect.",
  employee: "Phone number or password is incorrect.",
  driver: "Phone number or password is incorrect.",
  admin: "Username or password is incorrect.",
};
const USERNAME_RE = /^[a-z0-9_.]{3,20}$/;
const pendingAdmin = {}; // pendingId -> {userId, fails, code, phone, expires}
const ADMIN_CODE_MINUTES = 5;
const STAFF_ROLES = ["employee", "driver"];

function pinProblem(pin) {
  if (!/^\d{4}$/.test(pin)) return "Your PIN must be exactly 4 digits.";
  if (/^(\d)\1{3}$/.test(pin) || pin === "1234") return "That PIN is too easy to guess. Choose another one.";
  return null;
}

function passwordProblem(pw, username) {
  if (String(pw).length < 10) return "Use at least 10 characters.";
  if (!/[a-z]/i.test(pw) || !/\d/.test(pw)) return "Use at least one letter and one number.";
  if (pw.toLowerCase() === "password" || (username && username.length >= 3 && pw.toLowerCase().includes(username.toLowerCase()))) return "Don't use your name, username or the word \"password\".";
  return null;
}

function readSession() {
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null"); } catch (e) { return null; }
}
function writeSession(s) {
  try { if (s) sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); else sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* private mode: session lives in memory */ }
  memSession = s;
}
let memSession = null;

function signOut() { writeSession(null); }

function findUserByName(store, username) {
  const u = String(username || "").trim().toLowerCase();
  return store.list("users").find(x => x.username === u) || null;
}

function currentUser(store) {
  const s = readSession() || memSession;
  if (!s) return null;
  const u = store.get("users", s.userId);
  if (!u || !u.active || u.role !== s.role) { signOut(); return null; }
  if (Date.now() - (s.lastActive || s.at) > IDLE_LIMIT[s.role]) { signOut(); return null; }
  s.lastActive = Date.now();
  writeSession(s);
  return u;
}

function requireRole(store, ...roles) {
  const u = currentUser(store);
  if (!u || !roles.includes(u.role)) { const e = new Error("You're not allowed to do that. Please sign in again."); e.code = "forbidden"; throw e; }
  return u;
}

async function recordFailure(store, user) {
  const settings = store.get("settings", "shop");
  await store.transaction(tx => {
    const u = tx.get("users", user.id);
    u.failedAttempts = (u.failedAttempts || 0) + 1;
    if (u.failedAttempts >= settings.lockout.attempts) { u.lockedUntil = Date.now() + settings.lockout.minutes * 60000; u.failedAttempts = 0; }
    tx.put("users", u);
  });
}

async function signUpCustomer(store, { username, displayName, phone, pin, avatar }) {
  const uname = String(username || "").trim().toLowerCase();
  if (!USERNAME_RE.test(uname)) return { ok: false, error: "Usernames are 3–20 characters: letters, numbers, dots or underscores." };
  const ph = normalizePhone(phone);
  if (!ph) return { ok: false, error: "Enter a valid South African cellphone number, e.g. 071 234 5678." };
  const p = pinProblem(String(pin || ""));
  if (p) return { ok: false, error: p };
  if (findUserByName(store, uname)) return { ok: false, error: "That username is taken. Try another one." };
  const salt = randomSaltB64();
  const user = { id: randomId("usr"), role: "customer", username: uname, displayName: String(displayName || "").trim() || uname, phone: ph,
    avatar: Math.min(12, Math.max(1, avatar | 0 || 1)), secretSalt: salt, secretIter: SECRET_ITERATIONS, secretHash: await hashSecret(pin, salt),
    totpSecret: null, failedAttempts: 0, lockedUntil: null, mustChangeSecret: false, active: true, createdAt: Date.now(), lastLoginAt: Date.now(), returning: false };
  await store.transaction(tx => {
    if (tx.list("users").some(x => x.username === uname)) throw new Error("That username is taken. Try another one.");
    tx.put("users", user);
  });
  writeSession({ userId: user.id, role: "customer", at: Date.now(), lastActive: Date.now() });
  return { ok: true, user, firstTime: true };
}

/* Employees and drivers sign in with their cellphone number, which is unique among staff. */
function findStaffByPhone(store, phone) {
  const ph = normalizePhone(phone);
  return ph ? store.list("users").find(x => x.role !== "customer" && x.phone === ph) || null : null;
}

/* fields: {username?, phone?, secret}. Returns {ok, user, needCode, pendingId, mustChange, returning} or {ok:false, error}. */
async function signIn(store, role, fields) {
  const generic = GENERIC[role];
  const user = STAFF_ROLES.includes(role) ? findStaffByPhone(store, fields.phone) : findUserByName(store, fields.username);
  const candidate = user && user.role === role ? user : null;
  if (!candidate) { await hashSecret(String(fields.secret || "x"), "AAAAAAAAAAAAAAAAAAAAAA==", 20000); return { ok: false, error: generic }; }
  if (candidate.lockedUntil && candidate.lockedUntil > Date.now()) return { ok: false, error: generic + " Too many attempts: try again later." };
  let good = !!candidate.active;
  if (role === "customer") good = good && normalizePhone(fields.phone) === candidate.phone;
  const secretOk = await verifySecret(String(fields.secret || ""), candidate);
  if (!(good && secretOk)) { await recordFailure(store, candidate); return { ok: false, error: generic }; }
  await store.transaction(tx => { const u = tx.get("users", candidate.id); u.failedAttempts = 0; u.lockedUntil = null; tx.put("users", u); });
  if (role === "admin") {
    const pendingId = randomId("pnd");
    pendingAdmin[pendingId] = { userId: candidate.id, fails: 0 };
    return { ok: true, needCode: true, pendingId };
  }
  return finishSignIn(store, candidate);
}

async function finishSignIn(store, user) {
  const returning = !!user.returning;
  await store.transaction(tx => { const u = tx.get("users", user.id); u.lastLoginAt = Date.now(); tx.put("users", u); });
  writeSession({ userId: user.id, role: user.role, at: Date.now(), lastActive: Date.now() });
  return { ok: true, user, returning, mustChange: !!user.mustChangeSecret };
}

/* The admin's second check: a one-time 6-digit code sent by SMS to one of the owners' numbers (settings.adminPhones).
   Demo: there is no SMS server, so the code comes back here and is shown on screen as a simulated SMS. */
function adminPhones(s) {
  return (s && s.adminPhones && s.adminPhones.length ? s.adminPhones : DEFAULT_ADMIN_PHONES).filter(x => x && x.phone).slice(0, 3);
}
function sendAdminCode(store, pendingId, index) {
  const p = pendingAdmin[pendingId];
  if (!p) return { ok: false, error: "Please sign in again.", restart: true };
  const target = adminPhones(store.get("settings", "shop"))[index | 0];
  if (!target) return { ok: false, error: "Choose one of the numbers." };
  const n = new Uint32Array(1); crypto.getRandomValues(n);
  p.code = String(n[0] % 1000000).padStart(6, "0"); p.phone = target.phone; p.expires = Date.now() + ADMIN_CODE_MINUTES * 60000;
  return { ok: true, phone: target.phone, name: target.name, demoCode: p.code, minutes: ADMIN_CODE_MINUTES };
}

async function verifyAdminCode(store, pendingId, code) {
  const p = pendingAdmin[pendingId];
  if (!p) return { ok: false, error: "Please sign in again.", restart: true };
  if (!p.code) return { ok: false, error: "Send yourself a code first." };
  if (Date.now() > p.expires) { p.code = null; return { ok: false, error: "That code has expired. Send a new one.", expired: true }; }
  const user = store.get("users", p.userId);
  if (user && String(code || "").trim() === p.code) {
    delete pendingAdmin[pendingId];
    return finishSignIn(store, user);
  }
  p.fails++;
  if (user) await recordFailure(store, user);
  if (p.fails >= 3) { delete pendingAdmin[pendingId]; return { ok: false, error: "Too many wrong codes. Sign in with your password again.", restart: true }; }
  return { ok: false, error: `That code isn't right. ${3 - p.fails} ${3 - p.fails === 1 ? "try" : "tries"} left.` };
}

async function changeOwnSecret(store, newSecret) {
  const me = currentUser(store);
  if (!me) return { ok: false, error: "Please sign in again." };
  const problem = me.role === "customer" ? pinProblem(newSecret) : passwordProblem(newSecret, me.username);
  if (problem) return { ok: false, error: problem };
  const salt = randomSaltB64(), hash = await hashSecret(newSecret, salt);
  await store.transaction(tx => { const u = tx.get("users", me.id); Object.assign(u, { secretSalt: salt, secretIter: SECRET_ITERATIONS, secretHash: hash, mustChangeSecret: false }); tx.put("users", u); });
  return { ok: true };
}

/* The admin types the name and number; the new employee or driver types their own password on the admin's phone. */
async function createStaff(store, { role, displayName, phone, password, password2 }) {
  requireRole(store, "admin");
  if (!STAFF_ROLES.includes(role)) return { ok: false, error: "Choose employee or driver." };
  const name = String(displayName || "").trim();
  if (name.length < 2) return { ok: false, error: "Type their full name." };
  const ph = normalizePhone(phone);
  if (!ph) return { ok: false, error: "Enter a valid cellphone number, e.g. 071 234 5678." };
  if (findStaffByPhone(store, ph)) return { ok: false, error: "A staff member already uses that number." };
  const pw = passwordProblem(password, name.split(/\s+/)[0]);
  if (pw) return { ok: false, error: "Password: " + pw };
  if (password !== password2) return { ok: false, error: "The two passwords don't match." };
  const uname = "staff" + ph.slice(-9);
  const salt = randomSaltB64();
  const user = { id: randomId("usr"), role, username: uname, displayName: name, phone: ph, avatar: role === "driver" ? 9 : 5,
    secretSalt: salt, secretIter: SECRET_ITERATIONS, secretHash: await hashSecret(password, salt), totpSecret: null, failedAttempts: 0, lockedUntil: null,
    mustChangeSecret: false, active: true, createdAt: Date.now(), lastLoginAt: null, returning: true };
  await store.transaction(tx => {
    if (tx.list("users").some(x => x.role !== "customer" && x.phone === ph)) throw new Error("A staff member already uses that number.");
    tx.put("users", user);
  });
  return { ok: true, user };
}

/* Forgotten password: the staff member types a new one on the admin's phone. */
async function resetStaffSecret(store, userId, password, password2) {
  requireRole(store, "admin");
  const u = store.get("users", userId);
  if (!u || !STAFF_ROLES.includes(u.role)) return { ok: false, error: "Only employee and driver passwords can be changed here." };
  const pw = passwordProblem(password, u.displayName.split(/\s+/)[0]);
  if (pw) return { ok: false, error: "Password: " + pw };
  if (password !== password2) return { ok: false, error: "The two passwords don't match." };
  const salt = randomSaltB64(), hash = await hashSecret(password, salt);
  await store.transaction(tx => { const x = tx.get("users", userId); Object.assign(x, { secretSalt: salt, secretIter: SECRET_ITERATIONS, secretHash: hash, mustChangeSecret: false, failedAttempts: 0, lockedUntil: null }); tx.put("users", x); });
  return { ok: true };
}

/* Removes an employee or driver for good. Their past orders keep the name that was on them. */
async function deleteStaff(store, userId) {
  requireRole(store, "admin");
  const u = store.get("users", userId);
  if (!u || !STAFF_ROLES.includes(u.role)) return { ok: false, error: "Only employees and drivers can be deleted here." };
  if (store.list("orders", o => o.driverId === userId && ["with_driver", "on_the_way"].includes(o.status)).length)
    return { ok: false, error: u.displayName + " still has a delivery on the go. Wait until it's delivered." };
  await store.remove("users", userId);
  return { ok: true, user: u };
}

/* ---------------- sheet ---------------- */
let sheetClose = null, sheetReturn = null;

    <button type="button" class="sheet-x" data-act="sheet-close" aria-label="Close">✕</button><div class="sheet-body">${html}</div></div>`;

/* Redraw an open sheet's contents, keeping its scroll position, its accessible name and the focused control. */

    + (a.name ? `[name="${CSS.escape(a.name)}"]` : "") + (a.id && a.id !== "sheet-title" ? "#" + CSS.escape(a.id) : "") : "";

/* Emoji next to words are decoration: hide them from screen readers so "💳 Card" reads as "Card". */

    EMOJI_RE.test(n.nodeValue) && !n.parentElement.closest("[aria-hidden],svg,script,style") ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    const parts = n.nodeValue.split(new RegExp("(" + EMOJI_RE.source + ")", "u")), frag = document.createDocumentFragment();
    parts.forEach((t, i) => { if (!t) return; if (i % 2) { const sp = document.createElement("span"); sp.setAttribute("aria-hidden", "true"); sp.textContent = t; frag.appendChild(sp); } else frag.appendChild(document.createTextNode(t)); });

/* Two-step confirm: first tap arms the button for 3 s. Returns true when confirmed. */

function formData(form) {

/* Forms marked data-keep hold on to what was typed when the page redraws (an error, picking an avatar, a live update).
   Drafts live in memory only, per page, and are dropped on sign-in, sign-out and after a successful save. */
const drafts = {};
function saveDrafts(route) {
  for (const f of $$("form[data-keep]", $("#view"))) {
    const d = drafts[route + "|" + f.id] = {};
    for (const el of f.elements) if (el.name) d[el.name + (el.type === "radio" ? "=" + el.value : "")] = el.type === "checkbox" || el.type === "radio" ? el.checked : el.value;
  }

    const d = drafts[route + "|" + f.id]; if (!d) continue;
    for (const el of f.elements) {

      const k = el.name + (el.type === "radio" ? "=" + el.value : "");

/* ---------------- routing ---------------- */

  const [path, query = ""] = h.split("?");

/* ---------------- app-wide registries (filled by the page files) ---------------- */
const App = { user: null, memCart: null, booted: false };
const Actions = {}, Inputs = {}, Changes = {};

/* ---- ops.js ---- */
/* ops.js: every data-changing action. Each runs inside store.transaction (all-or-nothing, cross-tab lock),
   re-reads fresh data, checks the role (docs/SECURITY.md §3) and the domain rules, then writes. */

const store = createLocalStore();

function settings() { return store.get("settings", "shop"); }
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0);

function menuState(src = store) {
  const sections = src.list("menuSections").sort(byOrder);
  const items = src.list("menuItems").filter(i => i.active !== false).sort(byOrder);
  const groups = src.list("optionGroups"), stock = src.list("stockItems");
  const stockById = byId(stock), sectionsById = byId(sections), groupsById = byId(groups), menuById = byId(src.list("menuItems"));
  return { sections, items, groups, stock, stockById, sectionsById, groupsById, menuById, avail: i => isAvailable(i, { stockById, sectionsById }) };
}

function shopIsOpen(s = settings()) { return isOpen(Date.now(), s) || !!s.demoIgnoreHours; }

function fail(msg) { const e = new Error(msg); e.userMessage = msg; throw e; }

/* cart lines: [{menuItemId, qty, options:[{groupId, optionId}]}]
   checkout: {fulfilment, address, tip, method, ref} */
async function placeOrder(cart, checkout) {
  const me = requireRole(store, "customer");
  return store.transaction(tx => {
    const s = tx.get("settings", "shop");
    if (!(isOpen(Date.now(), s) || s.demoIgnoreHours)) fail(`Mandiba is closed right now. Orders open at ${s.openTime}.`);
    if (!cart.length) fail("Your cart is empty.");
    const m = menuState(tx);
    const lines = [], soldOut = [];
    for (const c of cart) {
      const item = m.menuById[c.menuItemId];
      if (!item || item.active === false || !m.avail(item)) { soldOut.push(c.menuItemId); continue; }
      const err = validateOptions(item, c.options, m.groupsById);
      if (err) fail(`${item.name}: ${err}`);
      const unitPrice = priceLine(item, c.options, m.groupsById);
      lines.push({ menuItemId: item.id, name: item.name, qty: c.qty, unitPrice, options: resolveOptions(c.options, m.groupsById), lineTotal: unitPrice * c.qty });
    }
    if (soldOut.length) { const e = new Error("sold out"); e.code = "soldout"; e.ids = soldOut; e.userMessage = "Sorry, something in your cart just sold out. We've removed it; please check your cart."; throw e; }
    const need = stockNeeded(lines, m.menuById, m.groupsById);
    const now = Date.now();
    const counter = tx.get("counters", "orders") || { id: "orders", next: 1 };
    const order = {
      id: randomId("ord"), number: "MND-" + String(counter.next).padStart(4, "0"), customerId: me.id, customerName: me.displayName,
      customerPhone: me.phone, customerAvatar: me.avatar, lines, fulfilment: checkout.fulfilment,
      address: checkout.fulfilment === "delivery" ? checkout.address : null,
      ...orderTotals(lines, checkout.fulfilment, s, checkout.tip),
      payment: { method: checkout.method, status: checkout.method === "cash" ? "cash_due" : "paid", ref: checkout.ref || null, at: now },
      status: "received", timeline: { received: now }, driverId: null, alerts: {}, stockApplied: true, cancelReason: null, createdAt: now,
    };
    const r = deductForOrder(m.stockById, need, { refId: order.id, by: me.id, at: now });
    if (!r.ok) { const e = new Error("sold out"); e.code = "soldout"; e.ids = []; e.userMessage = `Sorry, we just ran out of ${r.error.replace(/^Not enough /, "")}. Please change your order.`; throw e; }
    for (const it of r.items) tx.put("stockItems", it);
    for (const mv of r.movements) tx.put("stockMovements", { id: randomId("mov"), ...mv });
    tx.put("orders", order);
    tx.put("counters", { ...counter, next: counter.next + 1 });
    tx.put("notifications", { id: randomId("ntf"), ...newOrderNotification(order, tx.list("users"), s, now) });
    const u = tx.get("users", me.id); u.returning = true; tx.put("users", u);
    return order;
  });
}

/* opts: {driverId, cashReceived, reason} */
async function moveOrder(orderId, next, opts = {}) {
  const me = requireRole(store, "employee", "admin", "driver");
  return store.transaction(tx => {
    const o = tx.get("orders", orderId);
    if (!o) fail("That order no longer exists.");
    if (!canTransition(o, next, me.role, me.id)) fail(`This order can't go to "${STATUS_LABEL[next]}" from "${STATUS_LABEL[o.status]}".`);
    const now = Date.now();
    if (next === "with_driver") {
      const d = tx.get("users", opts.driverId);
      if (!d || d.role !== "driver" || !d.active) fail("Choose a driver first.");
      o.driverId = d.id;
      const s = tx.get("settings", "shop");
      tx.put("locations", { id: o.id, driver: { ...s.shopLocation, at: now }, customer: o.address && o.address.lat != null ? { lat: o.address.lat, lng: o.address.lng, at: now, source: o.address.source } : null, customerSeenAt: 0 });
    }
    if ((next === "collected" || next === "delivered") && o.payment.status === "cash_due") {
      if (!opts.cashReceived) fail(`Confirm you've received the cash (${formatRand(o.total)}) first.`);
      o.payment = { ...o.payment, status: "cash_received", at: now };
    }
    if (next === "cancelled") {
      if (!String(opts.reason || "").trim()) fail("Give a reason for cancelling.");
      const m = menuState(tx);
      const r = restoreStock(m.stockById, stockNeeded(o.lines, m.menuById, m.groupsById), { refId: o.id, by: me.id, at: now });
      for (const it of r.items) tx.put("stockItems", it);
      for (const mv of r.movements) tx.put("stockMovements", { id: randomId("mov"), ...mv });
      o.cancelReason = String(opts.reason).trim();
      if (o.payment.status === "paid") o.payment = { ...o.payment, status: "refunded", at: now };
    }
    if (next === "preparing") {
      for (const n of tx.list("notifications", n => n.orderId === o.id && !n.ackAt && (n.type === "new_order" || n.type === "order_reminder")))
        tx.put("notifications", { ...n, ackBy: me.id, ackAt: now });
    }
    if (["delivered", "cancelled"].includes(next)) tx.remove("locations", o.id);
    o.status = next; o.timeline = { ...o.timeline, [next]: now };
    tx.put("orders", o);
    return o;
  });
}

async function toggleSoldOut(itemId, soldOut) {
  requireRole(store, "employee", "admin");
  return store.transaction(tx => { const i = tx.get("menuItems", itemId); if (i) { i.soldOutManual = soldOut; tx.put("menuItems", i); } });
}

/* lines: [{stockItemId, qty, unitPrice, name}] */
async function tillSale(lines, method) {
  const me = requireRole(store, "employee", "admin");
  return store.transaction(tx => {
    if (!lines.length) fail("Add something to the sale first.");
    const stockById = byId(tx.list("stockItems")), now = Date.now(), id = randomId("till");
    const delta = {};
    for (const l of lines) delta[l.stockItemId] = (delta[l.stockItemId] || 0) - l.qty;
    const r = applyStock(stockById, delta, { reason: "till", refId: id, by: me.id, at: now });
    if (!r.ok) fail(r.error + " in stock for this sale.");
    for (const it of r.items) tx.put("stockItems", it);
    for (const mv of r.movements) tx.put("stockMovements", { id: randomId("mov"), ...mv });
    const sale = { id, lines: lines.map(l => ({ stockItemId: l.stockItemId, name: l.name, qty: l.qty, unitPrice: l.unitPrice })),
      total: lines.reduce((a, l) => a + l.qty * l.unitPrice, 0), method, by: me.id, at: now };
    tx.put("tillSales", sale);
    return sale;
  });
}

/* p: {supplier, date, source, lines:[{stockItemId, qty, unitCost}], slipPhoto, voiceText, voiceAudio, note} */
async function savePurchase(p) {
  const me = requireRole(store, "admin");
  return store.transaction(tx => {
    const lines = (p.lines || []).filter(l => l.stockItemId && l.qty > 0);
    if (!lines.length) fail("Add at least one line with an item and a quantity.");
    if (lines.some(l => !(l.unitCost >= 0))) fail("Every line needs a unit cost (it can be R0.00).");
    const stockById = byId(tx.list("stockItems")), now = Date.now(), id = randomId("pur");
    const delta = {};
    for (const l of lines) delta[l.stockItemId] = (delta[l.stockItemId] || 0) + l.qty;
    const r = applyStock(stockById, delta, { reason: "purchase", refId: id, by: me.id, at: now });
    if (!r.ok) fail(r.error);
    for (const it of r.items) {
      const l = lines.filter(x => x.stockItemId === it.id).pop();
      tx.put("stockItems", { ...it, costPrice: l ? l.unitCost : it.costPrice });
    }
    for (const mv of r.movements) tx.put("stockMovements", { id: randomId("mov"), ...mv });
    const total = Math.round(lines.reduce((a, l) => a + l.qty * l.unitCost, 0));
    tx.put("purchases", { id, supplier: p.supplier || "", date: p.date, source: p.source, lines, total, slipPhoto: p.slipPhoto || null,
      slipRead: p.slipRead || null, voiceText: p.voiceText || null, voiceAudio: p.voiceAudio || null, note: p.note || "", by: me.id, at: now });
    return id;
  });
}

/* patch: {qty?, costPrice?, sellPrice?, lowAt?, name?, tracked?} */
async function adjustStock(stockItemId, patch, reason, note) {
  const me = requireRole(store, "admin");
  return store.transaction(tx => {
    const s = tx.get("stockItems", stockItemId);
    if (!s) fail("That stock item no longer exists.");
    const now = Date.now();
    if (patch.qty != null && patch.qty !== s.qty) {
      if (patch.qty < 0) fail("Quantity can't be negative.");
      tx.put("stockMovements", { id: randomId("mov"), stockItemId, delta: Math.round((patch.qty - s.qty) * 1000) / 1000, qtyAfter: patch.qty, reason: reason || "adjust", refId: null, note: note || "", by: me.id, at: now });
    }
    tx.put("stockItems", { ...s, ...patch });
  });
}

/* counts: {stockItemId: countedQty} */
async function saveStocktake(counts, note) {
  const me = requireRole(store, "admin");
  return store.transaction(tx => {
    const now = Date.now(), ref = randomId("stk");
    let changed = 0;
    for (const [id, counted] of Object.entries(counts)) {
      const s = tx.get("stockItems", id);
      if (!s || !s.tracked || counted == null || isNaN(counted)) continue;
      const diff = Math.round((counted - s.qty) * 1000) / 1000;
      if (diff === 0) continue;
      tx.put("stockItems", { ...s, qty: counted });
      tx.put("stockMovements", { id: randomId("mov"), stockItemId: id, delta: diff, qtyAfter: counted, reason: "stocktake", refId: ref, note: note || "", by: me.id, at: now });
      changed++;
    }
    return changed;
  });
}

async function recordAlert(orderId, kind, channel) {
  return store.transaction(tx => {
    const o = tx.get("orders", orderId);
    if (!o || o.status !== "on_the_way" || (o.alerts || {})[kind]) return false;
    o.alerts = { ...(o.alerts || {}), [kind]: { at: Date.now(), channel } };
    tx.put("orders", o);
    if (channel === "sms") tx.put("notifications", { id: randomId("ntf"), type: kind === "near" ? "driver_near" : "driver_arrived", orderId, to: [{ userId: o.customerId, role: "customer", phone: o.customerPhone }],
      channels: ["sms"], simulated: true, at: Date.now(), ackBy: null, ackAt: null });
    return true;
  });
}

async function writeLocation(orderId, who, pos) {
  return store.transaction(tx => {
    const l = tx.get("locations", orderId);
    if (!l) return;
    if (who === "seen") l.customerSeenAt = Date.now();
    else l[who] = { lat: pos.lat, lng: pos.lng, at: Date.now(), source: pos.source || "gps" };

  });
}

/* Any tab may run this; the transaction re-checks, so reminders are never duplicated. */
async function runReminders() {
  return store.transaction(tx => {
    const s = tx.get("settings", "shop");
    if (!s) return 0;
    const notes = tx.list("notifications"), users = tx.list("users"), now = Date.now();
    let n = 0;
    for (const o of tx.list("orders", o => o.status === "received")) {
      if (reminderDue(o, notes, s, now)) {
        const base = newOrderNotification(o, users, s, now);
        tx.put("notifications", { id: randomId("ntf"), ...base, type: "order_reminder" });
        n++;
      }
    }
    return n;
  });
}
