const LEAFLET_JS = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
const LEAFLET_CSS = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
// Published cdnjs hashes (checked 30 Sep 2026). Change them together with the version.
const LEAFLET_JS_SRI = "sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==";
const LEAFLET_CSS_SRI = "sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==";
let leafletReady = null;
function ensureLeaflet() {
  if (!leafletReady) { loadCss(LEAFLET_CSS, LEAFLET_CSS_SRI); leafletReady = loadScript(LEAFLET_JS, 15000, LEAFLET_JS_SRI).then(() => window.L); }
  return leafletReady;
}

/* Mounts a map in `el`; returns {update({shop, driver, customer})}. */
function mountMap(el) {
  let state = {}, map = null, marks = {}, fallback = false;
  const pinIcon = (color, label) => window.L.divIcon({ className: "", iconSize: [34, 34], iconAnchor: [17, 17],
    html: `<div style="width:34px;height:34px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);display:grid;place-items:center;color:#fff;font:800 12px Inter,sans-serif">${label}</div>` });
  function drawFallback() {
    const pts = ["shop", "driver", "customer"].map(k => state[k]).filter(Boolean);
    if (!pts.length) { el.innerHTML = `<div class="empty">No location yet.</div>`; return; }
    const lats = pts.map(p => p.lat), lngs = pts.map(p => p.lng);
    const minLat = Math.min(...lats) - 0.002, maxLat = Math.max(...lats) + 0.002, minLng = Math.min(...lngs) - 0.002, maxLng = Math.max(...lngs) + 0.002;
    const X = lng => 20 + (lng - minLng) / (maxLng - minLng || 1) * 280, Y = lat => 180 - (lat - minLat) / (maxLat - minLat || 1) * 160;
    const dot = (p, c, t) => p ? `<circle cx="${X(p.lng)}" cy="${Y(p.lat)}" r="9" fill="${c}" stroke="#fff" stroke-width="3"/><text x="${X(p.lng) + 13}" y="${Y(p.lat) + 4}" font-size="11" font-weight="700" fill="currentColor">${t}</text>` : "";
    el.innerHTML = `<svg viewBox="0 0 320 200" style="width:100%;height:100%;color:var(--ink)" role="img" aria-label="Map of the delivery"><rect width="320" height="200" fill="var(--sunk)"/>
      <path d="M0 150 L320 120" stroke="var(--line)" stroke-width="10"/><text x="10" y="195" font-size="10" fill="var(--muted)">Maungani · Univen (simple map: live map unavailable)</text>
      ${dot(state.shop, "#161211", "Mandiba")}${dot(state.customer, "#1D5C99", "Customer")}${dot(state.driver, "#E48A2F", "Driver")}</svg>`;
  }
  function draw() {
    if (fallback || !window.L) return drawFallback();
    const L = window.L;
    if (!map) {
      el.innerHTML = "";
      map = L.map(el, { zoomControl: true, attributionControl: true });
      const tiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(map);
      tiles.on("tileerror", () => { if (!map._tilesOk) { fallback = true; map.remove(); map = null; drawFallback(); } });
      tiles.on("tileload", () => { map._tilesOk = true; });
    }
    const spec = { shop: ["#161211", "M"], customer: ["#1D5C99", "You"], driver: ["#E48A2F", "🛵"] };
    const pts = [];
    for (const k of Object.keys(spec)) {
      const p = state[k];
      if (!p) { if (marks[k]) { marks[k].remove(); delete marks[k]; } continue; }
      pts.push([p.lat, p.lng]);
      if (!marks[k]) marks[k] = L.marker([p.lat, p.lng], { icon: pinIcon(spec[k][0], k === "customer" ? (state.customerLabel || "You") : spec[k][1]) }).addTo(map);
      else marks[k].setLatLng([p.lat, p.lng]);
    }
    if (pts.length === 1) map.setView(pts[0], 16);
    else if (pts.length > 1 && !map._fitted) { map.fitBounds(pts, { padding: [40, 40], maxZoom: 17 }); map._fitted = true; }
  }
  ensureLeaflet().then(draw).catch(() => { fallback = true; draw(); });
  return { update(next) { state = { ...state, ...next }; draw(); }, refit() { if (map) { map._fitted = false; map.invalidateSize(); draw(); } } };
}

function itemSheetClick(ev) {
  const b = ev.target.closest("[data-sact]");

  const d = cx.draft, m = menuState(), item = m.menuById[d.menuItemId];
  if (b.dataset.sact === "opt") {
    const g = m.groupsById[b.dataset.g], idx = d.options.findIndex(x => x.groupId === b.dataset.g && x.optionId === b.dataset.o);
    if (idx >= 0) d.options.splice(idx, 1);
    else if (d.options.filter(x => x.groupId === g.id).length < g.max) d.options.push({ groupId: g.id, optionId: b.dataset.o });
    else toast(`You can choose up to ${g.max}.`);
  } else if (b.dataset.sact === "qty") {
    d.qty = Math.max(1, Math.min(20, d.qty + Number(b.dataset.d)));
  } else if (b.dataset.sact === "add") {
    if (validateOptions(item, d.options, m.groupsById)) return;
    let cart = getCart();
    if (d.editKey) cart = cart.filter(l => cartLineKey(l) !== d.editKey);

    setCart(cart); closeSheet(); toast(`${item.name} added`); renderApp();
    return;
  }
  setSheetBody(itemSheetHtml());
}

function checkoutAddress(c, s) {
  if (c.fulfilment !== "delivery") return { ok: true, address: null };
  const near = s.shopLocation, res = DEFAULT_RES_POINT;
  if (c.mode === "res") { if (!c.res.trim() || !c.room.trim()) return { ok: false, error: "Enter your residence and room." }; return { ok: true, address: { text: `${c.res.trim()}, ${c.room.trim()}`, res: c.res.trim(), room: c.room.trim(), lat: res.lat, lng: res.lng, source: "typed" } }; }
  if (c.mode === "text") { if (c.text.trim().length < 5) return { ok: false, error: "Type your address or directions." }; return { ok: true, address: { text: c.text.trim(), res: "", room: "", lat: near.lat + 0.006, lng: near.lng - 0.005, source: "typed" } }; }
  if (c.mode === "link") { if (!c.point) return { ok: false, error: "That link has no location in it. Try Share → Copy link in Google Maps, or type your address." }; return { ok: true, address: { text: "Pin from Google Maps link", res: "", room: "", lat: c.point.lat, lng: c.point.lng, source: "maps_link" } }; }
  if (c.mode === "gps") { if (!c.point) return { ok: false, error: "Tap \"Use my current location\" first, or choose another option." }; return { ok: true, address: { text: c.text.trim() || "My current location", res: "", room: "", lat: c.point.lat, lng: c.point.lng, source: "live" } }; }
  return { ok: false, error: "Choose where to deliver." };
}

async function placeCheckout(btn) {
  const c = cx.checkout, s = settings();
  const tip = c.fulfilment === "delivery" ? (c.tipCustom !== "" ? Math.max(0, Math.round(Number(c.tipCustom) * 100) || 0) : c.tip) : 0;
  const a = checkoutAddress(c, s);
  if (!a.ok) { c.error = a.error; renderApp(); return; }
  const doPlace = async ref => {
    try {
      const order = await placeOrder(getCart(), { fulfilment: c.fulfilment, address: a.address, tip, method: c.method, ref });
      setCart([]); cx.checkout = null; closeSheet();
      toast(`Order ${order.number} placed!`);
      go("#/c/track/" + order.id);
    } catch (e) {
      closeSheet();
      if (e.code === "soldout") setCart(getCart().filter(l => !(e.ids || []).includes(l.menuItemId)));
      c.error = e.userMessage || e.message; go(e.code === "soldout" ? "#/c/cart" : "#/c/checkout"); renderApp(); if (e.code === "soldout") toast(c.error);
    }
  };
  if (c.method === "cash") { btn.disabled = true; await doPlace(null); return; }
  const m = menuState(), lines = getCart().map(l => ({ unitPrice: priceLine(m.menuById[l.menuItemId], l.options, m.groupsById), qty: l.qty }));
  const total = orderTotals(lines, c.fulfilment, s, tip).total;
  const banks = ["Absa", "Capitec", "Discovery Bank", "FNB", "Investec", "Nedbank", "Standard Bank", "TymeBank", "African Bank"];
  const panel = openSheet(`<h2>${c.method === "card" ? "Card payment" : "Instant EFT"}</h2>
    <p class="note">Demo payment: no card number or banking login is needed, and no money moves.</p>
    ${c.method === "eft" ? `<div class="field"><label for="pay-bank">Your bank</label><select id="pay-bank">${banks.map(b => `<option>${b}</option>`).join("")}</select></div>` : `<div class="row"><span class="tag t-mute">Visa</span><span class="tag t-mute">Mastercard</span><span class="small muted">Secure 3-D check simulated</span></div>`}
    <div class="kv total"><span>Amount</span><b>${money(total)}</b></div>
    <button class="btn primary block" data-pay="ok">Approve payment (demo)</button>
    <button class="link small" data-pay="decline" style="align-self:center">Simulate a declined payment</button>`);
  panel.addEventListener("click", async ev => {
    const b = ev.target.closest("[data-pay]");
    if (!b) return;
    if (b.dataset.pay === "decline") { closeSheet(); c.error = "Payment declined by the bank (demo). Nothing was charged. Try again or pay cash."; renderApp(); return; }
    b.disabled = true; b.textContent = "Processing…";
    await new Promise(r => setTimeout(r, 900));
    await doPlace((c.method === "card" ? "CARD-" : "EFT-") + randomId("").slice(1, 9).toUpperCase());
  });
}

/* ---------------- tracker ---------------- */
function customerTrack(orderId) {
  const o = store.get("orders", orderId);
  if (!o || o.customerId !== App.user.id) return `<div class="card empty">Order not found.<a class="btn" href="#/c/orders" style="margin:12px auto 0">My orders</a></div>`;
  const flow = o.status === "cancelled" ? ["received", "cancelled"] : STATUS_FLOW[o.fulfilment];
  const idx = flow.indexOf(o.status);
  const label = st => st === "ready" && o.fulfilment === "collection" ? "Ready: come collect" : STATUS_LABEL[st];
  const live = o.fulfilment === "delivery" && ["with_driver", "on_the_way"].includes(o.status);
  const loc = store.get("locations", o.id);
  const driver = o.driverId ? store.get("users", o.driverId) : null;
  return `<div class="row between"><h1>Order ${esc(o.number)}</h1><span class="tag ${o.status === "cancelled" ? "t-red" : TERMINAL.includes(o.status) ? "t-good" : "t-orange"}">${esc(label(o.status))}</span></div>
  ${o.status === "cancelled" ? `<div class="warnbox">This order was cancelled: ${esc(o.cancelReason || "")}. ${o.payment.status === "refunded" ? "Your payment is refunded." : ""}</div>` : ""}
  <div class="grid2">
    <div class="card"><ol class="steps">${flow.map((st, k) => `<li class="${k < idx || (k === idx && TERMINAL.includes(o.status)) ? "done" : k === idx ? "now" : ""}"><span class="dot">${k < idx || TERMINAL.includes(o.status) && k <= idx ? "✓" : k + 1}</span><span class="st">${esc(label(st))}</span><span class="tm">${fmtTime(o.timeline[st])}</span></li>`).join("")}</ol>
      ${o.fulfilment === "collection" && o.status === "ready" ? `<div class="warnbox">Your order is ready. Come collect at Mandiba, next to Univen Gate.</div>` : ""}
      ${driver && live ? `<p>Your driver: <b>${esc(driver.displayName)}</b></p>` : ""}</div>
    ${live ? `<div class="card"><div class="row between"><span class="label">Live map</span>${loc && loc.driver ? `<span class="small muted">Driver updated ${esc(ago(loc.driver.at))}</span>` : ""}</div><div class="map" id="trackmap"></div>
      <div class="row"><button class="btn sm" data-act="share-loc" data-id="${o.id}">${cx.geoWatch ? "📍 Sharing live location · stop" : "📍 Share my live location"}</button>
      <button class="btn sm" data-act="notify-perm">🔔 Phone alerts</button></div>
      <p class="small muted">We'll alert you when your driver is within ${settings().nearMeters} m and when they arrive. Your location is only shared during this delivery.</p></div>` : ""}
  </div>
  <div class="card"><span class="label">Your order</span>${o.lines.map(l => `<div class="kv"><span>${l.qty} × ${esc(l.name)}${l.options.length ? `<span class="small muted"> · ${esc(l.options.map(x => x.name).join(", "))}</span>` : ""}</span><b>${money(l.unitPrice * l.qty)}</b></div>`).join("")}
    ${o.fulfilment === "delivery" ? `<div class="kv"><span>Delivery</span><b>${money(o.deliveryFee)}</b></div><div class="kv"><span>Driver tip</span><b>${money(o.tip)}</b></div><p class="small muted">To: ${esc(o.address.text)}</p>` : ""}
    <div class="divider"></div><div class="kv total"><span>Total</span><b>${money(o.total)}</b></div>
    <p class="small muted">${o.payment.method === "cash" ? (o.payment.status === "cash_received" ? "Paid in cash." : "Cash on " + o.fulfilment + ".") : `Paid by ${o.payment.method === "card" ? "card" : "Instant EFT"}${o.payment.status === "refunded" ? " (refunded)" : ""}.`}</p></div>`;
}

function afterTrack(orderId) {
  const o = store.get("orders", orderId);
  if (!o) return;
  const el = $("#trackmap");
  if (el) {
    if (!cx.map || cx.map.orderId !== orderId || cx.map.el !== el) cx.map = { orderId, el, m: mountMap(el) };
    const loc = store.get("locations", orderId) || {};
    cx.map.m.update({ shop: settings().shopLocation, driver: loc.driver, customer: loc.customer, customerLabel: "You" });
  }
  clearInterval(cx.seenTimer);
  if (o.fulfilment === "delivery" && ["with_driver", "on_the_way"].includes(o.status)) {
    const seen = () => writeLocation(orderId, "seen").catch(() => {});
    seen(); cx.seenTimer = setInterval(seen, 5000);
  }
}

function checkDeliveryAlerts() {
  if (!App.user || App.user.role !== "customer") return;
  for (const o of store.list("orders", x => x.customerId === App.user.id && x.status === "on_the_way")) {
    const loc = store.get("locations", o.id);
    if (!loc || !loc.driver) continue;
    const target = loc.customer || (o.address && o.address.lat != null ? o.address : null);
    if (!target) continue;
    const kind = alertFor(distanceM(loc.driver, target), settings(), o);
    if (!kind) continue;
    recordAlert(o.id, kind, "in_app").then(done => {
      if (!done) return;
      const title = kind === "near" ? "🛵 Your driver is nearby!" : "✅ Your driver has arrived!";
      const body = kind === "near" ? `Order ${o.number} is less than ${settings().nearMeters} m away.` : `Order ${o.number} is outside. Enjoy your meal!`;
      showAlert({ title, body, tone: kind === "near" ? "black" : "good", action: { label: "Track", hash: "#/c/track/" + o.id } });
      beep(kind === "near" ? [660, 880] : [880, 880, 1175]); browserNotify(title, body);
    });
  }
}

function toggleShareLocation(orderId) {
  if (cx.geoWatch) { navigator.geolocation.clearWatch(cx.geoWatch); cx.geoWatch = null; renderApp(); return; }
  if (!("geolocation" in navigator)) { toast("This browser can't share location. Your address is used instead."); return; }
  let last = 0;
  cx.geoWatch = navigator.geolocation.watchPosition(p => {
    if (Date.now() - last < 8000) return;
    last = Date.now();
    writeLocation(orderId, "customer", { lat: p.coords.latitude, lng: p.coords.longitude, source: "gps" });
  }, () => { toast("Location permission was refused: the driver will use your address."); navigator.geolocation.clearWatch(cx.geoWatch); cx.geoWatch = null; renderApp(); },
  { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
  renderApp();
}

/* ---------------- history & profile ---------------- */
function customerOrders() {
  const mine = store.list("orders", o => o.customerId === App.user.id).sort((a, b) => b.createdAt - a.createdAt);
  return `<h1>My orders</h1>${mine.length ? `<div class="stack">${mine.map(o => `<div class="card"><div class="row between"><b>${esc(o.number)}</b><span class="tag ${o.status === "cancelled" ? "t-red" : TERMINAL.includes(o.status) ? "t-good" : "t-orange"}">${esc(STATUS_LABEL[o.status])}</span></div>
    <span class="small muted">${esc(fmtWhen(o.createdAt))} · ${o.fulfilment === "delivery" ? "Delivery" : "Collection"} · ${money(o.total)}</span>
    <span>${esc(o.lines.map(l => `${l.qty}× ${l.name}`).join(", "))}</span>
    <div class="row"><a class="btn sm" href="#/c/track/${o.id}">${TERMINAL.includes(o.status) ? "Details" : "Track"}</a><button class="btn sm primary" data-act="reorder" data-id="${o.id}">Reorder</button></div></div>`).join("")}</div>`
    : `<div class="card empty">No orders yet.<a class="btn primary" href="#/c/menu" style="margin:12px auto 0">Browse the menu</a></div>`}`;
}

function reorder(orderId) {
  const o = store.get("orders", orderId), m = menuState();
  let added = 0, skipped = 0;
  const cart = getCart();
  for (const l of o.lines) {
    const i = m.menuById[l.menuItemId];
    const opts = l.options.map(x => ({ groupId: x.groupId, optionId: x.optionId }));
    if (!i || !m.avail(i) || validateOptions(i, opts, m.groupsById)) { skipped++; continue; }
    cart.push({ menuItemId: i.id, qty: l.qty, options: opts }); added++;
  }
  setCart(cart);
  toast(skipped ? `${added} item(s) added. ${skipped} sold out or changed.` : "Added to your cart.");
  go("#/c/cart");
}

function customerProfile() {
  const u = App.user, platter = parseRoute().query.platter;

    <span class="label">Change your avatar</span><div class="avpick">${Array.from({ length: 12 }, (_, k) => `<button data-act="set-avatar" data-id="${k + 1}" aria-pressed="${u.avatar === k + 1}" aria-label="Avatar ${k + 1}">${avatarSvg(k + 1, 48)}</button>`).join("")}</div></div>
  <form class="card" id="pinform"><span class="label">Change your PIN</span><div class="grid2"><div class="field"><label for="np">New 4-digit PIN</label><input id="np" name="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"></div></div><p class="err" id="pinerr"></p><button class="btn" style="align-self:flex-start">Save PIN</button></form>
  <form class="card" id="platform" ${platter ? 'style="border-color:var(--orange)"' : ""}><span class="label">Request a platter</span>
    <div class="grid2"><div class="field"><label for="pl-date">For which day?</label><input id="pl-date" name="date" type="date" required></div><div class="field"><label for="pl-people">How many people?</label><input id="pl-people" name="people" type="number" min="2" max="200" value="10" required></div></div>
    <div class="field"><label for="pl-note">What would you like?</label><textarea id="pl-note" name="note" placeholder="e.g. wings, wors and chips for a braai"></textarea></div>

function afterProfile() {
  $("#pinform").addEventListener("submit", async ev => {
    ev.preventDefault();
    const r = await changeOwnSecret(store, formData(ev.target).pin);
    $("#pinerr").textContent = r.ok ? "" : r.error;
    if (r.ok) { toast("PIN changed"); ev.target.reset(); }
  });

    const f = formData(ev.target), u = requireRole(store, "customer");

const CustomerArea = {
  nav: [["menu", "Menu"], ["cart", "Cart"], ["orders", "My orders"], ["profile", "Profile"]],
  render(page, arg) {
    if (page === "cart") return customerCart();
    if (page === "checkout") return customerCheckout();
    if (page === "track") return customerTrack(arg);
    if (page === "orders") return customerOrders();
    if (page === "profile") return customerProfile();
    return customerMenu();
  },
  after(page, arg) {
    if (page === "track") afterTrack(arg);

  },
  badge(page) { return page === "cart" ? cartCount() : 0; },
};

Actions["sec"] = b => { cx.section = b.dataset.id; cx.scroll = true; renderApp(); };
Actions["open-item"] = b => openItemSheet(b.dataset.id);

Actions["co"] = b => {

  if (!("geolocation" in navigator)) { toast("This browser can't share location. Please type your address."); return; }

};

Inputs["menu-search"] = el => { cx.q = el.value; renderApp({ keepFocus: true }); };
Inputs["co"] = el => {

const ex = { till: [], tillMethod: "cash", airtime: "", boardCol: "received", soQ: "" };

function orderCard(o, role) {
  const nexts = nextStatuses(o, role, App.user.id).filter(s => s !== "cancelled");
  const drivers = store.list("users", u => u.role === "driver" && u.active);
  const fresh = o.status === "received" && Date.now() - o.createdAt < 120000;
  const btn = st => {
    if (st === "with_driver") return `<div class="row"><select data-driver="${o.id}" aria-label="Choose a driver">${drivers.map(d => `<option value="${d.id}">${esc(d.displayName)}</option>`).join("")}</select>
      <button class="btn sm primary" data-act="move" data-id="${o.id}" data-to="with_driver" ${drivers.length ? "" : "disabled"}>Hand to driver</button></div>`;

      <span class="tag ${o.fulfilment === "delivery" ? "t-info" : "t-warn"}">${o.fulfilment === "delivery" ? "Delivery" : "Collection"}</span></div>

    ${o.fulfilment === "delivery" ? `<span class="small muted">📍 ${esc(o.address.text)}</span>` : ""}

function openDriverFull(orderId) {

function refreshDriverFull() {
  if (!dx.fullId) return;
  const o = store.get("orders", dx.fullId);
  if (!o || !["with_driver", "on_the_way"].includes(o.status)) { closeDriverFull(); return; }
  const loc = store.get("locations", o.id) || {};
  const target = loc.customer || null;

  $("#fulltitle").textContent = `${o.customerName} · ${o.number}`;
  $("#fullsub").textContent = `${o.address.text}${dist != null ? " · " + (dist < 1000 ? Math.round(dist) + " m" : (dist / 1000).toFixed(1) + " km") + " away" : ""}${target && target.at ? " · customer location updated " + ago(target.at) : " · customer location not shared"}`;
  $("#fullactions").innerHTML = `${target ? `<a class="btn primary" href="${esc(mapsDirectionsUrl(target))}" target="_blank" rel="noopener">Open in Google Maps</a>` : ""}
    <button class="btn" data-act="drv-sim">${dx.sim ? "⏸ Stop simulated drive" : "▶ Simulate drive (demo)"}</button>
    <button class="btn" data-act="drv-gps">${dx.gps ? "📡 Using my GPS · stop" : "📡 Use my real GPS"}</button>
    <a class="btn" href="tel:${esc(o.customerPhone)}">📞 Call</a>`;
  dx.map.update({ shop: settings().shopLocation, driver: loc.driver, customer: target, customerLabel: "C" });

function closeDriverFull() {
  dx.fullId = null; stopSim(); stopGps();
  const full = $("#full"); full.hidden = true; full.innerHTML = ""; dx.map = null;
  try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) { /* optional */ }
}

function stopSim() { clearInterval(dx.sim); dx.sim = null; }
function stopGps() { if (dx.gps != null) navigator.geolocation.clearWatch(dx.gps); dx.gps = null; }

async function driverMoved(orderId, pos) {
  await writeLocation(orderId, "driver", pos);
  const o = store.get("orders", orderId), loc = store.get("locations", orderId);
  if (!o || o.status !== "on_the_way" || !loc || !loc.customer) return;
  const kind = alertFor(distanceM(loc.driver, loc.customer), settings(), o);
  if (!kind) return;
  const customerOnline = loc.customerSeenAt && Date.now() - loc.customerSeenAt < 12000;
  if (customerOnline) return; // the customer's own screen shows the alert
  if (await recordAlert(orderId, kind, "sms"))
    toast(`📱 SMS sent to ${o.customerName} (simulated): "${kind === "near" ? "Your Mandiba driver is nearby" : "Your driver has arrived"}"`);
}

function startSim() {
  stopGps();
  const id = dx.fullId;
  const o = store.get("orders", id);
  if (o && o.status === "with_driver") toast("Tip: tap \"On my way\" first so the customer gets the alerts.");
  dx.sim = setInterval(() => {
    const loc = store.get("locations", id);
    if (!loc || !loc.driver || !loc.customer) { stopSim(); refreshDriverFull(); return; }
    const next = stepToward(loc.driver, loc.customer, 40);
    driverMoved(id, { ...next, source: "sim" });
    if (distanceM(next, loc.customer) < 1) { stopSim(); toast("Arrived at the customer (simulated)."); refreshDriverFull(); }
  }, 1500);
  refreshDriverFull();
}

function startGps() {
  stopSim();
  if (!("geolocation" in navigator)) { toast("This browser can't share location."); return; }
  const id = dx.fullId;
  let last = 0;
  dx.gps = navigator.geolocation.watchPosition(p => {
    if (Date.now() - last < 4000) return;
    last = Date.now();
    driverMoved(id, { lat: p.coords.latitude, lng: p.coords.longitude, source: "gps" });
  }, () => { toast("Location permission was refused."); stopGps(); refreshDriverFull(); }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  refreshDriverFull();
}

function fmtQty(q, unit) {
  if (unit === "g" && q >= 1000) return (q / 1000).toFixed(q % 1000 ? 1 : 0) + " kg";
  if (unit === "ml" && q >= 1000) return (q / 1000).toFixed(1) + " L";
  const n = Math.round(q * 100) / 100;
  return n + (unit === "piece" ? "" : " " + unit + (unit === "loaf" && n !== 1 ? "s" : ""));
}

function rerenderPurchase() { setSheetBody(purchaseHtml()); }

function purchaseInput(ev) {
  const p = ax.purchase, el = ev.target;
  if (el.dataset.pin) p[el.dataset.pin] = el.value;
  if (el.dataset.pline) p.lines[Number(el.dataset.pline)][el.dataset.f] = el.value;
}
async function purchaseChange(ev) {
  const el = ev.target, p = ax.purchase;
  if (el.dataset.pline && el.dataset.f === "stockItemId") { p.lines[Number(el.dataset.pline)].stockItemId = el.value; rerenderPurchase(); }
  if (el.dataset.pfile === "slip" && el.files[0]) {
    try { p.slipPhoto = await compressImage(el.files[0], { maxDim: 1400, maxBytes: 250000 }); p.ocr = ""; }
    catch (e) { p.error = e.message; }
    rerenderPurchase();
  }
}

async function purchaseClick(ev) {
  const b = ev.target.closest("[data-pact]");
  if (!b) return;
  const p = ax.purchase, act = b.dataset.pact;
  if (act === "src") { stopRecording(); p.source = b.dataset.v; }
  if (act === "addline") p.lines.push({ stockItemId: "", qty: "", cost: "" });
  if (act === "rmline") { p.lines.splice(Number(b.dataset.k), 1); if (!p.lines.length) p.lines.push({ stockItemId: "", qty: "", cost: "" }); }
  if (act === "parse") {
    const r = parseSpokenPurchase(p.text, store.list("stockItems", s => s.active));
    const kept = p.lines.filter(l => l.stockItemId && l.qty !== "");
    p.lines = [...kept, ...r.lines.map(l => ({ stockItemId: l.stockItemId, qty: String(l.qty), cost: l.unitCost != null ? (l.unitCost / 100).toFixed(2) : "", phrase: l.phrase }))];
    p.unmatched = r.unmatched;
    if (!p.lines.length) p.lines.push({ stockItemId: "", qty: "", cost: "" });
    toast(`${r.lines.length} line(s) found${r.unmatched.length ? `, ${r.unmatched.length} not understood` : ""}.`);
  }
  if (act === "rec") { if (ax.rec) stopRecording(); else await startRecording(); }
  if (act === "ocr") await readSlip();
  if (act === "save") return savePurchaseSheet();
  rerenderPurchase();
}

async function startRecording() {
  const p = ax.purchase;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  ax.rec = { chunks: [], rec: null, sr: null, stream: null, base: p.text ? p.text.trim() + ", " : "" };
  try {
    if (navigator.mediaDevices && window.MediaRecorder) {
      ax.rec.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mr = new MediaRecorder(ax.rec.stream), chunks = [];
      mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = async () => {
        const blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
        if (blob.size > 1000000) toast("The recording is over 1 MB, so it isn't kept. Your words are still saved.");
        else if (blob.size) { p.voiceAudio = await fileToDataUrl(blob); rerenderPurchase(); }
      };
      mr.start(); ax.rec.rec = mr;
    }
  } catch (e) { toast("Microphone permission was refused. Type instead, or use your keyboard's 🎤 key."); ax.rec = null; return; }
  if (SR) {
    const sr = new SR(); sr.lang = "en-ZA"; sr.continuous = true; sr.interimResults = true;
    sr.onresult = e => {
      let txt = ""; for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript + " ";
      p.text = (ax.rec ? ax.rec.base : "") + txt.trim();
      const ta = $("#ptext"); if (ta) ta.value = p.text;
    };
    sr.onerror = () => {};
    try { sr.start(); ax.rec.sr = sr; } catch (e) { /* speech optional */ }
  }
}

function stopRecording() {
  if (!ax.rec) return;
  const r = ax.rec;
  try { if (r.sr) r.sr.stop(); } catch (e) { /* ignore */ }
  try { if (r.rec && r.rec.state !== "inactive") r.rec.stop(); } catch (e) { /* ignore */ }
  if (r.stream) r.stream.getTracks().forEach(t => t.stop());
  ax.rec = null;
  setTimeout(() => { if (ax.purchase && ax.purchase.text) toast("Now tap \"Turn into stock lines\"."); }, 300);
}

async function readSlip() {
  const p = ax.purchase;
  p.ocr = "Reading the slip… (the first time takes a little longer)"; rerenderPurchase();
  try {
    await loadScript(TESSERACT_JS, 30000, TESSERACT_SRI);
    const res = await window.Tesseract.recognize(p.slipPhoto, "eng");
    const lines = res.data.text.split("\n").map(s => s.trim()).filter(s => /[a-z]/i.test(s) && /\d/.test(s));
    const guess = lines.map(l => {
      const m = l.match(/^(.*?)(\d+)\s*[x@*]\s*(\d+[.,]\d{2})/i) || l.match(/^(\d+)\s+(.*?)\s+(\d+[.,]\d{2})/);
      if (!m) return null;
      return /^\d/.test(m[1]) ? `${m[1]} ${m[2]} at R${m[3]}` : `${m[2]} ${m[1].trim()} at R${m[3]}`;
    }).filter(Boolean);
    p.text = guess.length ? guess.join(", ") : lines.join(", ");
    p.ocr = guess.length ? `Found ${guess.length} line(s) on the slip. Check the text below, then tap "Turn into stock lines".` : "Couldn't find clear item lines; the slip text is below. Edit it or type the lines.";
  } catch (e) { p.ocr = "Slip reading isn't available right now. The photo is still attached: type or say the items instead."; }
  rerenderPurchase();
}

async function savePurchaseSheet() {
  const p = ax.purchase;
  const lines = [];
  for (const l of p.lines) {
    if (!l.stockItemId && !l.qty) continue;
    const cost = parseRandInput(l.cost), qty = Number(l.qty);
    if (!l.stockItemId || !(qty > 0) || cost == null) { p.error = "Every line needs an item, a quantity and a cost like 9.50. Remove lines you don't need."; rerenderPurchase(); return; }
    lines.push({ stockItemId: l.stockItemId, qty, unitCost: cost });
  }
  if (p.unmatched.length && !confirmTap($("[data-pact=save]"), "Some words weren't understood: tap again to save anyway")) return;
  try {
    await savePurchase({ supplier: p.supplier.trim(), date: p.date, source: p.source, lines, slipPhoto: p.slipPhoto, voiceText: p.text.trim() || null, voiceAudio: p.voiceAudio,
      slipRead: p.source === "photo" ? { status: p.text ? "read" : "none", at: Date.now() } : null });
    closeSheet(); toast("Purchase saved: stock updated"); ax.stockTab = "purchases"; renderApp();
  } catch (e) { p.error = e.userMessage || e.message; rerenderPurchase(); }
}

/* ---------------- accounting ---------------- */
function periodRange(p) {
  const now = Date.now(), day = sastDayStart(now);
  if (p === "today") return [day, day + 86400000, "Today"];
  if (p === "week") { const dow = (sastParts(now).dow + 6) % 7; return [day - dow * 86400000, day + 86400000, "This week"]; }
  const pp = sastParts(now), first = Date.UTC(pp.y, pp.mo, 1) - 7200e3;
  return [first, day + 86400000, "This month"];
}

function adminAccounting() {
  const [from, to, label] = periodRange(ax.period);
  const orders = store.list("orders"), till = store.list("tillSales"), purch = store.list("purchases");
  const a = accounting(orders, till, purch, from, to);
  const days = [];
  for (let d = from; d < to; d += 86400000) { const x = accounting(orders, till, purch, d, d + 86400000); days.push({ d, income: x.income, spend: x.spend }); }
  const max = Math.max(1, ...days.map(x => Math.max(x.income, x.spend))), W = 640, H = 170, bw = Math.max(6, (W - 60) / days.length / 2.4);
  const chart = days.length > 1 ? `<svg class="chart" viewBox="0 0 ${W} ${H + 24}" style="width:100%;height:auto" role="img" aria-label="Income and spending per day">
    <line x1="40" y1="${H}" x2="${W}" y2="${H}" stroke="var(--line)"/>${[0, 0.5, 1].map(f => `<text x="0" y="${H - f * (H - 10) + 3}">${money(max * f).replace(/\.00$/, "")}</text>`).join("")}
    ${days.map((x, k) => { const cx0 = 50 + k * (W - 60) / days.length; const hi = x.income / max * (H - 10), hs = x.spend / max * (H - 10);
      return `<rect x="${cx0}" y="${H - hi}" width="${bw}" height="${hi}" fill="var(--orange)"/><rect x="${cx0 + bw + 2}" y="${H - hs}" width="${bw}" height="${hs}" fill="var(--red)"/>${days.length <= 10 || k % Math.ceil(days.length / 10) === 0 ? `<text x="${cx0}" y="${H + 16}">${esc(fmtDate(x.d))}</text>` : ""}`; }).join("")}</svg>
    <div class="row small"><span class="tag t-orange">■ Income</span><span class="tag t-red">■ Spending</span></div>` : "";
  const top = a.bestSellers.slice(0, 8), tmax = Math.max(1, ...top.map(x => x.qty));
  return `<div class="row between"><h1>Accounting</h1><div class="row"><div class="seg">${[["today", "Today"], ["week", "This week"], ["month", "This month"]].map(([k, l]) => `<button data-act="period" data-id="${k}" aria-pressed="${ax.period === k}">${l}</button>`).join("")}</div>
    <button class="btn" data-act="csv">⬇ Export CSV</button></div></div>
  <div class="stats"><div class="stat hero2"><span class="label">Profit · ${esc(label)}</span><span class="v">${money(a.profit)}</span></div>
    <div class="stat"><span class="label">Money in</span><span class="v">${money(a.income)}</span><span class="tiny muted">orders ${money(a.orderIncome)} · till ${money(a.tillIncome)}</span></div>
    <div class="stat"><span class="label">Money out (purchases)</span><span class="v">${money(a.spend)}</span></div>
    <div class="stat"><span class="label">Driver tips (not income)</span><span class="v">${money(a.tips)}</span></div>
    <div class="stat"><span class="label">Cash still due</span><span class="v">${money(a.cashDue)}</span></div></div>
  <div class="grid2" style="align-items:start">
    <div class="card"><span class="label">Income and spending per day</span>${chart || `<p class="muted small">Choose "This week" or "This month" to see a daily chart.</p>`}</div>
    <div class="card"><span class="label">Best sellers</span>${top.length ? `<div class="bars">${top.map(x => `<div class="barrow"><div>${esc(x.name)}<div class="track"><div class="fill" style="width:${x.qty / tmax * 100}%"></div></div></div><b class="num" style="text-align:right">${x.qty}</b></div>`).join("")}</div>` : `<p class="muted small">No completed orders in this period yet.</p>`}
      <span class="label">Paid by</span>${["card", "eft", "cash"].map(k => `<div class="kv small"><span>${k === "eft" ? "Instant EFT" : k[0].toUpperCase() + k.slice(1)}</span><b>${money(a.byMethod[k] || 0)}</b></div>`).join("")}</div>
  </div>
  <p class="small muted">Money in counts delivered/collected orders that are paid (card, EFT, or cash marked received) plus till sales. Tips belong to the drivers and are never counted as shop income.</p>`;
}

  if (!e.name.trim()) { $("#eierr").textContent = "Give the item a name."; return; }

  const recipe = e.recipe.map(r => ({ stockItemId: r.stockItemId, qty: Number(r.qty) })).filter(r => r.qty > 0);
  requireRole(store, "admin");
  await store.transaction(tx => {
    const id = e.id || "itm-" + e.name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 24) + "-" + randomId("").slice(1, 5);
    const order = e.id ? e.order : tx.list("menuItems", i => i.sectionId === e.sectionId).length;
    const { priceText, ...rest } = e;
    tx.put("menuItems", { ...rest, id, order, name: e.name.trim(), description: e.description.trim(), price, recipe, active: true });
  });
  closeSheet(); toast("Menu updated: new orders use the new details. Past orders keep their prices.");
}

function afterSettings() {
  $("#setform").addEventListener("submit", async ev => {
    ev.preventDefault();
    const f = formData(ev.target), fee = parseRandInput(f.fee), phone = normalizePhone(f.shopPhone);
    if (fee == null) { $("#seterr").textContent = "Delivery fee must look like 5.00."; return; }
    if (!phone) { $("#seterr").textContent = "Enter a valid shop cellphone number."; return; }
    if (!(Number(f.arrived) < Number(f.near))) { $("#seterr").textContent = "The arrived distance must be smaller than the nearby distance."; return; }
    const owners = [];
    for (const k of [0, 1, 2]) {
      const n = String(f["apName" + k] || "").trim(), raw = String(f["apPhone" + k] || "").trim();
      if (!raw) continue;
      const ph = normalizePhone(raw);
      if (!ph) { $("#seterr").textContent = `Owner ${k + 1}'s cellphone number isn't valid.`; return; }
      owners.push({ name: n || `Owner ${k + 1}`, phone: ph });
    }
    if (!owners.length) { $("#seterr").textContent = "Add at least one owner number for the admin sign-in code."; return; }
    requireRole(store, "admin");
    await store.transaction(tx => { const s = tx.get("settings", "shop"); tx.put("settings", { ...s, deliveryFee: fee, openTime: f.openTime, closeTime: f.closeTime, nearMeters: Number(f.near), arrivedMeters: Number(f.arrived),
      demoIgnoreHours: !!f.demoIgnoreHours, adminPhones: owners, notify: { ...s.notify, shopPhone: phone, remindEveryMin: Math.max(1, Number(f.remind) || 2) } }); });
    toast("Settings saved");
  });
}

function afterLogin(role) {
  const form = $("#loginform");
  if (form) form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const f = formData(form);
    lx.busy = true; lx.error = ""; renderApp();
    let r;
    try {
      r = role === "customer" && lx.tab === "signup"
        ? await signUpCustomer(store, { username: f.username, displayName: f.displayName, phone: f.phone, pin: f.secret, avatar: lx.avatar })
        : await signIn(store, role, { username: f.username, phone: f.phone, secret: f.secret });
    } catch (e) { r = { ok: false, error: e.userMessage || e.message }; }
    lx.busy = false;
    if (!r.ok) { lx.error = r.error; renderApp(); return; }
    if (r.needCode) { lx.pending = r.pendingId; lx.sms = null; lx.error = ""; clearDrafts("loginform"); renderApp(); return; }
    signedIn(r);
  });
  const sf = $("#sendform");
  if (sf) sf.addEventListener("submit", ev => {
    ev.preventDefault();
    lx.phoneIdx = Number(($("input[name=to]:checked", sf) || {}).value || 0);
    const r = sendAdminCode(store, lx.pending, lx.phoneIdx);
    if (!r.ok) { lx.error = r.error; if (r.restart) lx.pending = null; renderApp(); return; }
    lx.sms = r; lx.error = ""; clearDrafts("codeform"); renderApp();
    const c = $("#code"); if (c) c.focus();
  });
  const cf = $("#codeform");
  if (cf) cf.addEventListener("submit", async ev => {
    ev.preventDefault();
    const code = formData(cf).code;
    lx.busy = true; renderApp();
    const r = await verifyAdminCode(store, lx.pending, code);
    lx.busy = false;
    if (!r.ok) { lx.error = r.error; if (r.restart) { lx.pending = null; lx.sms = null; } if (r.expired) lx.sms = null; renderApp(); return; }
    lx.pending = null; lx.sms = null; signedIn(r);
  });
}

function signedIn(r) {
  App.user = r.user; lx.error = ""; lx.tab = "signin"; clearDrafts();
  if (r.user.role === "customer") welcomeBanner(r.firstTime || !r.returning ? `Welcome to Mandiba, ${r.user.displayName}!` : `Sharp ${r.user.displayName}! Welcome back`);

}

/* ---------------- render ---------------- */
function renderApp(opts = {}) {
  renderQueued = false;
  App.user = currentUser(store);
  const r = parseRoute();
  let focus = null;
  let focusSel = null;
  if (opts.keepFocus) { const a = document.activeElement; if (a && a.dataset && a.dataset.input) focus = { input: a.dataset.input, k: a.dataset.k, id: a.dataset.id, pos: a.selectionStart }; else focusSel = focusKey(a); }
  let html = "", after = null, area = r.area, page = r.page;
  if (!r.area) { if (App.user) { go(HOME[App.user.role]); return; } html = startScreen(); }
  else if (r.area === "privacy" || r.area === "terms") { html = r.area === "privacy" ? privacyPage() : termsPage(); }
  else if (r.area === "login") {
    if (App.user && App.user.role === page) { go(HOME[page]); return; }
    html = loginScreen(page); after = () => afterLogin(page);
  } else if (AREAS[r.area]) {
    const need = AREA_ROLE[r.area];
    if (!App.user || App.user.role !== need) {
      if (App.user) toast(`You're signed in as ${ROLE_LABEL[App.user.role].toLowerCase()} in this tab. Sign out to switch.`);
      go(App.user ? HOME[App.user.role] : "#/login/" + need); return;
    }
    if (App.user.mustChangeSecret) { html = changeSecretScreen(); after = afterChangeSecret; }
    else {
      page = page || AREAS[r.area].nav[0][0];
      html = AREAS[r.area].render(page, r.arg);
      after = () => AREAS[r.area].after(page, r.arg);
    }
  } else { go("#/"); return; }
  renderBar(area, page);
  const route = location.hash || "#/";
  if (App.renderedRoute) saveDrafts(App.renderedRoute);
  $("#view").innerHTML = html;
  hideEmoji($("#view"));
  if (after) after();
  restoreDrafts(route); App.renderedRoute = route;
  updateCartBar();
  if (focus) {
    const sel = `[data-input="${focus.input}"]` + (focus.k ? `[data-k="${focus.k}"]` : "") + (focus.id ? `[data-id="${focus.id}"]` : "");
    const el = $(sel);
    if (el) { el.focus(); try { if (focus.pos != null) el.setSelectionRange(focus.pos, focus.pos); } catch (e) { /* number inputs */ } }
  }
  /* Keep keyboard users on the same button or link after a background redraw. */
  if (focusSel && !sheetOpen()) { const el = $(focusSel); if (el) el.focus({ preventScroll: true }); }
  document.title = App.user ? `Mandiba · ${ROLE_LABEL[App.user.role]}` : "Mandiba Spaza Shop";
}

function scheduleRender() {
  const a = document.activeElement;
  const typing = a && a.closest && a.closest("#view") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !a.dataset.input && a.type !== "checkbox";
  if (typing || sheetOpen() && parseRoute().area === "login") { deferred = true; return; }
  if (renderQueued) return;
  renderQueued = true;
  // Background tabs get no animation frames, so they redraw on a timer and stay current (e.g. a board left open behind another tab).
  const run = () => renderApp({ keepFocus: true });
  // Some embedded browsers pause animation frames while still reporting "visible", so a timer backs the frame up.
  if (document.hidden) { setTimeout(run, 60); return; }
  let done = false; const once = () => { if (!done) { done = true; run(); } };
  requestAnimationFrame(once); setTimeout(once, 250);
}

/* ---------------- live alerts ---------------- */
function handleNotifications() {
  const all = store.list("notifications").sort((a, b) => a.at - b.at);
  const fresh = all.filter(n => !seenNotes.has(n.id));
  for (const n of fresh) seenNotes.add(n.id);
  const u = App.user;
  if (u && u.role === "customer") return;
  const latest = {};
  for (const n of fresh) if (["new_order", "order_reminder"].includes(n.type)) latest[n.orderId] = n; // one alert per order
  for (const n of Object.values(latest)) {
    if (Date.now() - n.at > 5 * 60000) continue;
    const o = store.get("orders", n.orderId);
    if (!o || o.status !== "received") continue;
    const staff = u && (u.role === "employee" || u.role === "admin");
    const kind = o.fulfilment === "delivery" ? "Delivery" : "Collection";
    const title = n.type === "order_reminder" ? `Still waiting: ${o.number}` : `🔔 New order ${o.number}`;
    const body = staff ? `${money(o.total)} · ${kind} · ${o.customerName}` : `${money(o.total)} · ${kind}. Sign in to view`;
    showAlert({ title, body, action: staff ? { label: "Open board", hash: HOME[u.role] } : { label: "Sign in", hash: "#/login/employee" } });
    beep(); browserNotify(title, body);
  }
}

function onData(coll) {
  if (coll === "notifications") handleNotifications();
  if (coll === "orders" || coll === "locations") { checkDeliveryAlerts(); if (dx.fullId) refreshDriverFull(); }
  scheduleRender();
}

/* ---------------- events ---------------- */
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "noop") { ev.preventDefault(); return; }
  if (act === "alert-close") { $("#alertbar").classList.remove("show"); return; }
  if (act === "sheet-close") { closeSheet(); return; }
  if (b.tagName === "A" && !Actions[act]) return;
  if (Actions[act]) { ev.preventDefault(); Promise.resolve(Actions[act](b, ev)).catch(e => toast(e.userMessage || e.message)); }
});
document.addEventListener("input", ev => { const el = ev.target; if (el.dataset && el.dataset.input && Inputs[el.dataset.input]) Inputs[el.dataset.input](el); });
document.addEventListener("change", ev => { const el = ev.target; if (el.dataset && el.dataset.actChange && Changes[el.dataset.actChange]) Promise.resolve(Changes[el.dataset.actChange](el)).catch(e => toast(e.message)); });
document.addEventListener("focusout", () => { setTimeout(() => { if (deferred) { deferred = false; scheduleRender(); } }, 50); });
document.addEventListener("keydown", ev => { if (ev.key === "Tab" && sheetOpen()) trapSheetFocus(ev); if (ev.key === "Escape") { if (sheetOpen()) closeSheet(); else if (dx.fullId) closeDriverFull(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden && App.booted) scheduleRender(); });
window.addEventListener("hashchange", () => { if (sheetOpen()) closeSheet(); if (dx.fullId) closeDriverFull(); lx.error = ""; window.scrollTo(0, 0); renderApp(); });

Actions["signout"] = () => { signOut(); App.user = null; lx.pending = null; lx.sms = null; clearDrafts(); App.renderedRoute = null; go("#/"); };
Actions["to-login"] = b => go("#/login/" + b.dataset.id);
Actions["login-tab"] = b => { lx.tab = b.dataset.id; lx.error = ""; renderApp(); };
Actions["pick-avatar"] = b => { lx.avatar = Number(b.dataset.id); $$(".avpick button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); };
Actions["fill-demo"] = b => { const c = demoCreds(b.dataset.id), f = $("#loginform"); if (f.username) f.username.value = c.username; if (f.phone) f.phone.value = c.phone; f.secret.value = c.secret; };
Actions["code-cancel"] = () => { lx.pending = null; lx.sms = null; lx.error = ""; renderApp(); };
Actions["code-resend"] = () => { lx.sms = null; lx.error = ""; renderApp(); };
Actions["theme"] = () => { const order = ["auto", "light", "dark"]; applyTheme(order[(order.indexOf(themeName()) + 1) % 3]); renderApp(); };
Actions["notify-perm"] = async () => {
  if (!("Notification" in window)) { toast("This browser doesn't support notifications. On-screen alerts still work."); return; }
  const p = await Notification.requestPermission();
  toast(p === "granted" ? "Alerts are on for this browser while Mandiba is open." : "Notifications are blocked. On-screen alerts and sound still work.");
  renderApp();
};

/* ---------------- boot ---------------- */
async function boot() {
  try { const t = localStorage.getItem("mandiba.theme"); if (t && t !== "auto") applyTheme(t); } catch (e) { /* optional */ }
  if (!isSeeded(store)) {
    $("#view").innerHTML = `<div class="card" style="text-align:center"><div class="spin"></div><h2>Setting up the Mandiba demo…</h2><p class="muted">Loading the menu and securing the demo accounts. This only happens once on this device.</p></div>`;
    try { await seedDemo(store); } catch (e) { $("#view").innerHTML = `<div class="card"><h2>Couldn't set up the demo</h2><p class="err">${esc(e.message)}</p></div>`; return; }
  }
  if (store.memoryOnly) setTimeout(() => showAlert({ title: "Private window", body: "Demo data won't be saved after you close this window.", tone: "black", sticky: 8000 }), 800);
  // Alerts from before this tab opened are "seen", except orders from the last 5 minutes that nobody has picked up yet.
  seenNotes = new Set(store.list("notifications", n => Date.now() - n.at > 5 * 60000).map(n => n.id));
  for (const c of ALL_COLLECTIONS) store.subscribe(c, onData);
  App.booted = true;
  renderApp();
  setTimeout(handleNotifications, 600);
  setInterval(() => { runReminders().catch(() => {}); }, 30000);
  setInterval(() => { if (!document.hidden) scheduleRender(); }, 60000);
}

boot();

})();
</script>
</body>
</html>
